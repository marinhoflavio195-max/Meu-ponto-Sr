<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Ponto SR</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* --- ESTILO DO APLICATIVO (CSS) --- */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
      margin: 20px auto;
    }

    h1 {
      color: #d32f2f;
      margin-top: 0;
      font-size: 24px;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
      text-align: left;
      font-weight: bold;
    }

    /* Estilo do seletor de nomes */
    select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      margin-bottom: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      outline: none;
      box-sizing: border-box;
    }

    select:focus {
      border-color: #d32f2f;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #d32f2f;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:active {
      background: #b71c1c;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      color: #333;
      font-weight: bold;
    }

    #localizacao {
      margin-top: 15px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
      border: 1px solid #eee;
    }

    #mapa {
      width: 100%;
      height: 200px;
      margin-top: 15px;
      border-radius: 10px;
      border: 2px solid #d32f2f;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>MEU PONTO SR</h1>

    <label for="funcionario">QUEM ESTÁ BATENDO O PONTO?</label>
    <select id="funcionario">
      <option value="">-- Selecione seu nome --</option>
      <option value="Karine">Karine</option>
      <option value="Eudes">Eudes</option>
      <option value="Victor">Victor</option>
    </select>

    <p id="status">Nenhum ponto registrado</p>

    <button onclick="registrar('Entrada')">
      Registrar Entrada
    </button>

    <button onclick="registrar('Saída')">
      Registrar Saída
    </button>

    <div id="mapa"></div>

    <div id="localizacao">Aguardando registro...</div>

  </div>

  <script>
    let mapaObjeto = null;

    function registrar(tipo) {
      // Pega o nome selecionado na lista
      let nomeFuncionario = document.getElementById("funcionario").value;

      // Validação: Se não escolheu um nome, para o código aqui e avisa
      if (nomeFuncionario === "") {
        alert("Por favor, selecione seu nome antes de registrar o ponto!");
        return;
      }
      
      // Personaliza a mensagem com o nome de quem bateu o ponto
      document.getElementById("status").innerHTML = `${tipo} de <strong>${nomeFuncionario}</strong> registrado com sucesso!`;
      document.getElementById("localizacao").innerHTML = "Buscando localização exata...";

      if (navigator.geolocation) {
        
        navigator.geolocation.getCurrentPosition(
          function(posicao) {
            let lat = posicao.coords.latitude;
            let lon = posicao.coords.longitude;

            document.getElementById("localizacao").innerHTML = 
              `<strong>GPS Capturado</strong><br>
              Colaborador: ${nomeFuncionario}<br>
              Lat: ${lat.toFixed(6)} | Lon: ${lon.toFixed(6)}`;

            document.getElementById("mapa").style.display = "block";

            if (mapaObjeto === null) {
              mapaObjeto = L.map('mapa').setView([lat, lon], 16);

              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
              }).addTo(mapaObjeto);

              L.marker([lat, lon]).addTo(mapaObjeto)
                .bindPopup(`${nomeFuncionario} está aqui`)
                .openPopup();
            } else {
              mapaObjeto.setView([lat, lon], 16);
              L.marker([lat, lon]).addTo(mapaObjeto)
                .bindPopup(`${nomeFuncionario} está aqui`)
                .openPopup();
            }

            setTimeout(() => { mapaObjeto.invalidateSize(); }, 400);
          },
          function(erro) {
            document.getElementById("localizacao").innerHTML = "Erro ao capturar localização.";
            alert("Ative o GPS do celular e dê permissão no navegador.");
          },
          {
            enableHighAccuracy: true,
            timeout: 10000
          }
        );

      } else {
        alert("Seu navegador não suporta GPS.");
      }
    }
  </script>

</body>
</html>
