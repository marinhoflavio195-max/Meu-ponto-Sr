<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Ponto SR - Colaborador</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 90%; max-width: 400px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); text-align: center; box-sizing: border-box; margin: 20px auto; }
    h1 { color: #d32f2f; margin-top: 0; font-size: 24px; letter-spacing: 1px; }
    label { display: block; margin-top: 15px; font-size: 14px; color: #666; text-align: left; font-weight: bold; }
    select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 10px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; background: #fff; outline: none; box-sizing: border-box; }
    select:focus { border-color: #d32f2f; }
    #bloco-colaborador, #bloco-botoes, #bloco-camera { display: none; }
    
    button { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 10px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-entrada { background: #2e7d32; }
    .btn-saida-almoco { background: #f57c00; }
    .btn-retorno-almoco { background: #0288d1; }
    .btn-saida { background: #c62828; }
    .btn-capturar { background: #673ab7; margin-top: 15px; }
    .btn-cancelar { background: #757575; margin-top: 8px; }
    
    #status { margin-top: 15px; font-size: 15px; color: #333; font-weight: bold; background: #fff3e0; padding: 10px; border-radius: 6px; display: none; }
    .nuvem-status { font-size: 14px; color: #2e7d32; margin-top: 6px; display: none; font-weight: bold; }
    #localizacao { margin-top: 15px; padding: 12px; background: #f9f9f9; border-radius: 8px; font-size: 13px; color: #555; border: 1px solid #eee; text-align: left; }
    .btn-wpp { background: #25d366; color: white; margin-top: 10px; text-decoration: none; display: inline-block; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; font-weight: bold; }
    
    video { width: 100%; max-height: 250px; background: #000; border-radius: 10px; margin-top: 10px; transform: scaleX(-1); }
    canvas { display: none; }
    .preview-foto { width: 100%; max-height: 250px; border-radius: 10px; margin-top: 10px; display: none; border: 2px solid #2e7d32; }
  </style>
</head>
<body>

  <div class="container">
    <h1>MEU PONTO SR</h1>

    <label for="setor">1. SELECIONE O SETOR:</label>
    <select id="setor" onchange="filtrarColaboradores()">
      <option value="">-- Escolha o Setor --</option>
      <option value="escritorio">ESCRITÓRIO / ADMINISTRAÇÃO</option>
      <option value="rh">RH / DEPARTAMENTO PESSOAL</option>
      <option value="tesouraria">TESOURARIA</option>
      <option value="caixas">CAIXAS</option>
      <option value="repositores">REPOSITORES</option>
      <option value="almoxarifado">ALMOXARIFADO</option>
      <option value="açougue">AÇOUGUE</option>
      <option value="empacotadores">EMPACOTADORES</option>
      <option value="terceirizados">TERCEIRIZADOS / SEGURANÇA</option>
    </select>

    <div id="bloco-colaborador">
      <label for="colaborador">2. SELECIONE SEU NOME:</label>
      <select id="colaborador" onchange="verificarFluxoPontoDoDia()">
        </select>
    </div>

    <div id="bloco-botoes">
      <label style="text-align: center; margin-bottom: 5px; color: #333;">3. REGISTRE SEU PONTO:</label>
      <button id="btnEntrada" class="btn-entrada" style="display:none;" onclick="iniciarFluxoFoto('Entrada Manhã')">🌅 Registrar Entrada</button>
      <button id="btnSaidaAlmoco" class="btn-saida-almoco" style="display:none;" onclick="iniciarFluxoFoto('Saída Almoço')">🥪 Saída p/ Almoço</button>
      <button id="btnRetornoAlmoco" class="btn-retorno-almoco" style="display:none;" onclick="iniciarFluxoFoto('Retorno Almoço')">☕ Retorno do Almoço</button>
      <button id="btnSaidaFim" class="btn-saida" style="display:none;" onclick="iniciarFluxoFoto('Saída Expediente')">🛑 Saída Fim Expediente</button>
    </div>

    <div id="bloco-camera">
      <label id="tituloCamera" style="text-align: center; color: #673ab7;"></label>
      <video id="video" autoplay playsinline></video>
      <img id="preview" class="preview-foto" alt="Sua Selfie">
      <button class="btn-capturar" onclick="tirarFotoEValidarPonto()">📸 Tirar Foto e Confirmar</button>
      <button class="btn-cancelar" onclick="cancelarFluxoFoto()">Voltar</button>
    </div>

    <p id="status"></p>
    <div id="notificacaoWpp"></div>
    <p id="nuvem" class="nuvem-status">☁️ Conectando ao Banco...</p>

    <div id="localizacao">Aguardando seleção...</div>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJMoG89lg9TXxO9z1d8jxbAzGms9Ts1sc",
      authDomain: "meu-ponto-sr.firebaseapp.com",
      databaseURL: "https://meu-ponto-sr-default-rtdb.firebaseio.com",
      projectId: "meu-ponto-sr",
      storageBucket: "meu-ponto-sr.appspot.com",
      messagingSenderId: "356930006135",
      appId: "1:356930006135:web:90bc643a9cd39a38f02a72"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const MERCADO_LAT = -4.451406;
    const MERCADO_LON = -43.876278;
    const DISTANCIA_MAX_METROS = 50; // 🎯 Atualizado para 50 metros para máxima estabilidade na loja

    const equipe = {
      escritorio: ["Ezequiel", "Ruan", "André", "hilária"],
      rh: ["Flávio", "Altemar"],
      tesouraria: ["Inês"],
      caixas: ["Irene", "Karine", "Marta", "Daiane", "Jaqueline", "Rita", "Patrícia", "railma", "adrissa", "Erisva", "Débora"],
      repositores: ["talice", "Samira", "Rosimar", "Victor mix", "Débora", "Raiana", "dulce", "ediete Vinícius", "Henrique", "Alisson", "Gabriel", "levir"],
      almoxarifado: ["Netinho", "Denilson", "Thalles", "thalisson", "Flávia", "keverson", "Marcelo", "Alan", "Henrique", "Vilson"],
      açougue: ["Carlos", "Francisca", "Alice", "Érica", "Suely"],
      empacotadores: ["Felipe Frente", "Edmilson", "Raimundo Queiroz"],
      terceirizados: ["Roberto", "Acrísio", "graça", "novato mix"]
    };

    let streamCamera = null;
    let tipoPontoAtual = "";

    function filtrarColaboradores() {
      const setor = document.getElementById("setor").value;
      const blocoColaborador = document.getElementById("bloco-colaborador");
      const seletor = document.getElementById("colaborador");
      
      seletor.innerHTML = "";
      document.getElementById("bloco-botoes").style.display = "none";
      document.getElementById("status").style.display = "none";
      cancelarFluxoFoto();

      if (!setor) { blocoColaborador.style.display = "none"; return; }

      let opt = document.createElement("option");
      opt.value = ""; opt.text = "-- Escolha seu Nome --";
      seletor.appendChild(opt);

      equipe[setor].forEach(nome => {
        let o = document.createElement("option");
        o.value = nome; o.text = nome; seletor.appendChild(o);
      });
      blocoColaborador.style.display = "block";
    }

    function verificarFluxoPontoDoDia() {
      const nome = document.getElementById("colaborador").value;
      const blocoBotoes = document.getElementById("bloco-botoes");
      
      document.getElementById("btnEntrada").style.display = "none";
      document.getElementById("btnSaidaAlmoco").style.display = "none";
      document.getElementById("btnRetornoAlmoco").style.display = "none";
      document.getElementById("btnSaidaFim").style.display = "none";
      document.getElementById("notificacaoWpp").innerHTML = "";
      cancelarFluxoFoto();

      if (!nome) { blocoBotoes.style.display = "none"; return; }

      let agora = new Date();
      let dataChave = `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}-${String(agora.getDate()).padStart(2, '0')}`;

      database.ref('pontos_registrados')
        .orderByChild('colaborador')
        .equalTo(nome)
        .once('value', snapshot => {
          let batidas = { entrada: false, saidaAlmoco: false, retornoAlmoco: false, saidaFim: false };
          
          snapshot.forEach(child => {
            let p = child.val();
            if (p.dataChave === dataChave) {
              if (p.tipo === "Entrada Manhã") batidas.entrada = true;
              if (p.tipo === "Saída Almoço") batidas.saidaAlmoco = true;
              if (p.tipo === "Retorno Almoço") batidas.retornoAlmoco = true;
              if (p.tipo === "Saída Expediente") batidas.saidaFim = true;
            }
          });

          blocoBotoes.style.display = "block";

          if (!batidas.entrada) {
            document.getElementById("btnEntrada").style.display = "block";
            document.getElementById("localizacao").innerHTML = "Status: Aguardando registro de <strong>Entrada</strong>.";
          } else if (!batidas.saidaAlmoco) {
            document.getElementById("btnSaidaAlmoco").style.display = "block";
            document.getElementById("localizacao").innerHTML = "Status: Entrada registrada. Aguardando <strong>Saída pro Almoço</strong>.";
          } else if (!batidas.retornoAlmoco) {
            document.getElementById("btnRetornoAlmoco").style.display = "block";
            document.getElementById("localizacao").innerHTML = "Status: No almoço. Aguardando <strong>Retorno do Almoço</strong>.";
          } else if (!batidas.saidaFim) {
            document.getElementById("btnSaidaFim").style.display = "block";
            document.getElementById("localizacao").innerHTML = "Status: De volta do almoço. Aguardando <strong>Saída Fim de Expediente</strong>.";
          } else {
            document.getElementById("localizacao").innerHTML = "✅ Todos os 4 pontos de hoje já foram coletados e finalizados!";
          }
        });
    }

    function iniciarFluxoFoto(tipo) {
      tipoPontoAtual = tipo;
      document.getElementById("bloco-botoes").style.display = "none";
      document.getElementById("bloco-camera").style.display = "block";
      document.getElementById("tituloCamera").innerHTML = `POSICIONE A CÂMERA FRONTAL PARA: <br><strong>${tipo.toUpperCase()}</strong>`;
      
      document.getElementById("video").style.display = "block";
      document.getElementById("preview").style.display = "none";

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      }).then(stream => {
        streamCamera = stream;
        document.getElementById("video").srcObject = stream;
      }).catch(err => {
        alert("Erro ao acessar a câmera frontal. Verifique as permissões do seu navegador.");
        cancelarFluxoFoto();
      });
    }

    function cancelarFluxoFoto() {
      if(streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
        streamCamera = null;
      }
      document.getElementById("bloco-camera").style.display = "none";
      if(document.getElementById("colaborador").value) {
        document.getElementById("bloco-botoes").style.display = "block";
      }
    }

    function tirarFotoEValidarPonto() {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const fotoBase64 = canvas.toDataURL("image/jpeg", 0.5);

      if(streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
      }

      document.getElementById("bloco-camera").style.display = "none";
      validarEProcurarGPS(tipoPontoAtual, fotoBase64);
    }

    function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI/180;
      const φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180;
      const Δλ = (lon2-lon1) * Math.PI/180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function validarEProcurarGPS(tipo, fotoData) {
      if (!navigator.geolocation) { alert("Seu navegador não possui suporte a GPS."); return; }
      
      document.getElementById("status").style.display = "block";
      document.getElementById("status").innerHTML = "Validando localização de Cerca Virtual via GPS...";

      navigator.geolocation.getCurrentPosition(
        pos => {
          let lat = pos.coords.latitude;
          let lon = pos.coords.longitude;
          let distancia = calcularDistanciaMetros(lat, lon, MERCADO_LAT, MERCADO_LON);

          if (distancia > DISTANCIA_MAX_METROS) {
            document.getElementById("status").innerHTML = "❌ <strong>ACESSO BLOQUEADO POR DISTÂNCIA!</strong>";
            alert(`Bloqueado: Você precisa estar no supermercado para registrar o ponto (Distância atual: ${distancia.toFixed(1)} metros).`);
            verificarFluxoPontoDoDia();
            return;
          }

          gravarPonto(tipo, lat, lon, fotoData);
        },
        err => {
          alert("GPS Desativado. Ative a localização de alta precisão do seu smartphone.");
          verificarFluxoPontoDoDia();
        },
        { enableHighAccuracy: true, timeout: 12000 }
      );
    }

    function gravarPonto(tipo, lat, lon, fotoData) {
      let nome = document.getElementById("colaborador").value;
      let setorTexto = document.getElementById("setor").options[document.getElementById("setor").selectedIndex].text;
      
      let agora = new Date();
      let dataFormatada = agora.toLocaleDateString('pt-BR');
      let horaFormatada = agora.toLocaleTimeString('pt-BR');
      let dataChave = `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}-${String(agora.getDate()).padStart(2, '0')}`;

      let minutesAtraso = 0;
      let mensagemAtraso = "";
      let hora = agora.getHours();
      let minuto = agora.getMinutes();
      let totalMinutosDia = (hora * 60) + minuto;

      if (tipo === "Entrada Manhã") {
        if (totalMinutosDia < 510) { 
          if (totalMinutosDia > 425) minutesAtraso = totalMinutosDia - 420;
        } else { 
          if (totalMinutosDia > 605) minutesAtraso = totalMinutosDia - 600;
        }
      }

      if (minutesAtraso > 0) {
        mensagemAtraso = `⚠️ PONTO REGISTRADO COM ATRASO DE ${minutesAtraso} MINUTOS!`;
        let textoWpp = encodeURIComponent(`🚨 *Notificação Meu Ponto SR*:\nO colaborador *${nome}* (${setorTexto}) registrou a *Entrada* hoje às ${horaFormatada} com *${minutesAtraso} minutos de atraso*.`);
        document.getElementById("notificacaoWpp").innerHTML = `<a href="https://api.whatsapp.com/send?text=${textoWpp}" target="_blank" class="btn-wpp">📲 Enviar Notificação de Atraso para a Gerência</a>`;
      }

      document.getElementById("status").innerHTML = `<strong>${tipo}</strong> gravado com sucesso!`;
      document.getElementById("nuvem").style.display = "block";

      let novoPonto = database.ref('pontos_registrados').push();
      novoPonto.set({
        colaborador: nome,
        setor: setorTexto,
        tipo: tipo,
        data: dataFormatada,
        dataChave: dataChave,
        horario: horaFormatada,
        latitude: lat,
        longitude: lon,
        atrasoMinutos: minutesAtraso,
        fotoSelfie: fotoData
      }, function(error) {
        if (!error) {
          document.getElementById("nuvem").innerHTML = "✅ Sincronizado com o Meu Ponto SR!";
          verificarFluxoPontoDoDia(); 
        }
      });
    }
  </script>
</body>
</html>
