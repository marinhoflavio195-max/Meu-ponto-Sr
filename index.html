<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Ponto - São Raimundo</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f4f1; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .container-ponto { width: 100%; max-width: 450px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,74,38,0.15); border-top: 6px solid #006430; box-sizing: border-box; }
    
    h2 { color: #006430; text-align: center; margin-top: 0; margin-bottom: 5px; font-size: 22px; letter-spacing: 0.5px; }
    .subtitulo { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #ffd700; padding-bottom: 8px; }
    
    .campo-grupo { margin-bottom: 18px; }
    .campo-grupo label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #004a26; }
    .campo-grupo select { width: 100%; padding: 12px; border: 2px solid #a5d6a7; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #ffffff; color: #333; font-weight: bold; transition: border-color 0.2s; }
    .campo-grupo select:focus { border-color: #006430; outline: none; }
    .campo-grupo select:disabled { background-color: #e8f5e9; border-color: #c8e6c9; color: #888; }

    .btn-prosseguir { width: 100%; padding: 14px; background-color: #006430; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    .btn-prosseguir:hover { background-color: #004a26; }
    
    /* Área da Câmera (Oculta até selecionar o nome) */
    .area-camera { display: none; text-align: center; margin-top: 20px; border-top: 2px dashed #a5d6a7; padding-top: 20px; }
    #video { width: 100%; max-width: 320px; height: auto; border-radius: 8px; border: 3px solid #006430; background: #222; transform: scaleX(-1); }
    #canvas { display: none; }
    
    .btn-bater { width: 100%; padding: 15px; background-color: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    .btn-bater:hover { background-color: #1b5e20; }
  </style>
</head>
<body>

  <div class="container-ponto">
    <h2>SUPERMERCADO SÃO RAIMUNDO</h2>
    <div class="subtitulo">Registro de Ponto Eletrônico</div>

    <div class="campo-grupo">
      <label for="selecaoLoja">1. SELECIONE A SUA LOJA:</label>
      <select id="selecaoLoja" onchange="configurarFiltroSetores()">
        <option value="">-- Escolha a Loja --</option>
        <option value="1">Loja 1</option>
        <option value="2">Loja 2</option>
        <option value="3">Loja 3</option>
        <option value="4">Loja 4</option>
      </select>
    </div>

    <div class="campo-grupo">
      <label for="selecaoSetor">2. SELECIONE O SEU SETOR:</label>
      <select id="selecaoSetor" onchange="configurarFiltroNomes()" disabled>
        <option value="">-- Aguardando Loja... --</option>
      </select>
    </div>

    <div class="campo-grupo">
      <label for="selecaoNome">3. SELECIONE SEU NOME COMPLETO:</label>
      <select id="selecaoNome" onchange="liberarCamera()" disabled>
        <option value="">-- Aguardando Setor... --</option>
      </select>
    </div>

    <div class="campo-grupo" id="grupoTipoBatida" style="display: none;">
      <label for="selecaoTipo">4. O QUE ESTÁ REGISTRANDO AGORA?</label>
      <select id="selecaoTipo">
        <option value="Entrada Expediente">Entrada Expediente</option>
        <option value="Saida Almoço">Saída para Almoço</option>
        <option value="Retorno Almoço">Retorno do Almoço</option>
        <option value="Saida Fim">Saída Fim de Expediente</option>
      </select>
    </div>

    <div class="area-camera" id="blocoValidacao">
      <label style="display:block; font-weight:bold; color:#004a26; margin-bottom:10px;">OLHE PARA A CÂMERA PARA CONFIRMAÇÃO:</label>
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" width="320" height="240"></canvas>
      
      <button class="btn-bater" onclick="registrarPontoFinal()">📸 CONFIRMAR E REGISTRAR PONTO</button>
    </div>
  </div>

  <script>
    // Configurações do Firebase (Mesmo banco do Painel)
    const firebaseConfig = {
      apiKey: "AIzaSyBJMoG89lg9TXxO9z1d8jxbAzGms9Ts1sc",
      authDomain: "meu-ponto-sr.firebaseapp.com",
      databaseURL: "https://meu-ponto-sr-default-rtdb.firebaseio.com",
      projectId: "meu-ponto-sr",
      storageBucket: "meu-ponto-sr.appspot.com",
      messagingSenderId: "356930006135",
      appId: "1:356930006135:web:90bc643a9cd39a38f02a72"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let funcionariosMemoria = {};
    let streamCamera = null;
    let latAtual = null;
    let lonAtual = null;

    // 1. Captura a lista de funcionários em tempo real do Firebase
    function carregarDadosDoServidor() {
      database.ref('config_funcionarios').on('value', snapshot => {
        if(snapshot.exists()) {
          funcionariosMemoria = snapshot.val();
          // Se a loja já estiver selecionada, atualiza os próximos combos dinamicamente
          if(document.getElementById('selecaoLoja').value) {
            configurarFiltroSetores();
          }
        }
      });
    }

    // 2. Filtra os Setores baseando-se na Loja escolhida
    function configurarFiltroSetores() {
      const lojaSelecionada = document.getElementById('selecaoLoja').value;
      const comboSetor = document.getElementById('selecaoSetor');
      const comboNome = document.getElementById('selecaoNome');
      
      // Resetar os campos seguintes
      comboSetor.innerHTML = '<option value="">-- Escolha o Setor --</option>';
      comboNome.innerHTML = '<option value="">-- Aguardando Setor... --</option>';
      comboSetor.disabled = true;
      comboNome.disabled = true;
      fecharCamera();

      if(!lojaSelecionada) return;

      // Pegar setores únicos dessa loja
      let setoresUnicos = new Set();
      Object.keys(funcionariosMemoria).forEach(nome => {
        if(funcionariosMemoria[nome].loja === lojaSelecionada) {
          setoresUnicos.add(funcionariosMemoria[nome].setor);
        }
      });

      // Ordenar e preencher combo de setores
      Array.from(setoresUnicos).sort().forEach(setor => {
        comboSetor.innerHTML += `<option value="${setor}">${setor}</option>`;
      });

      comboSetor.disabled = false;
    }

    // 3. Filtra os Nomes baseando-se na Loja E no Setor escolhidos
    function configurarFiltroNomes() {
      const lojaSelecionada = document.getElementById('selecaoLoja').value;
      const comboSetor = document.getElementById('selecaoSetor').value;
      const comboNome = document.getElementById('selecaoNome');

      comboNome.innerHTML = '<option value="">-- Escolha seu Nome --</option>';
      comboNome.disabled = true;
      fecharCamera();

      if(!comboSetor) return;

      // Filtrar os funcionários que pertencem àquela loja e àquele setor especificamente
      Object.keys(funcionariosMemoria).sort().forEach(nome => {
        let f = funcionariosMemoria[nome];
        if(f.loja === lojaSelecionada && f.setor === comboSetor) {
          comboNome.innerHTML += `<option value="${nome}">${nome}</option>`;
        }
      });

      comboNome.disabled = false;
    }

    // 4. Ativa a câmera e o GPS quando o nome é finalmente selecionado
    function liberarCamera() {
      const nomeSel = document.getElementById('selecaoNome').value;
      const bloco = document.getElementById('blocoValidacao');
      const grupoTipo = document.getElementById('grupoTipoBatida');

      if(!nomeSel) {
        fecharCamera();
        return;
      }

      grupoTipo.style.display = 'block';
      bloco.style.display = 'block';

      // Inicializa a Câmera frontal
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then(stream => {
          streamCamera = stream;
          document.getElementById('video').srcObject = stream;
        })
        .catch(err => {
          alert("Aviso: Ative a permissão de câmera para registrar o ponto!");
        });

      // Captura a geolocalização (GPS)
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          latAtual = position.coords.latitude;
          lonAtual = position.coords.longitude;
        }, err => {
          console.log("GPS desativado ou recusado.");
        }, { enableHighAccuracy: true });
      }
    }

    function fecharCamera() {
      document.getElementById('blocoValidacao').style.display = 'none';
      document.getElementById('grupoTipoBatida').style.display = 'none';
      if(streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
        streamCamera = null;
      }
    }

    // 5. Captura a foto e salva o registro completo no Firebase
    function registrarPontoFinal() {
      const nomeColaborador = document.getElementById('selecaoNome').value;
      const tipoBatida = document.getElementById('selecaoTipo').value;
      const lojaAtual = document.getElementById('selecaoLoja').value;
      const setorAtual = document.getElementById('selecaoSetor').value;

      if(!nomeColaborador) return;

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // Tirar foto do vídeo
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);

      // Gerar marcações de data e hora corretas
      const agora = new Date();
      const diaStr = String(agora.getDate()).padStart(2, '0');
      const mesStr = String(agora.getMonth() + 1).padStart(2, '0');
      const anoStr = agora.getFullYear();
      
      const dataFormatada = `${diaStr}/${mesStr}/${anoStr}`;
      const horaFormatada = agora.toTimeString().split(' ')[0];
      const dataChave = `${anoStr}-${mesStr}-${diaStr}`;

      // Montar objeto que vai para o Painel Administrativo
      const registroPonto = {
        colaborador: nomeColaborador,
        loja: lojaAtual,
        setor: setorAtual,
        data: dataFormatada,
        dataChave: dataChave,
        horario: horaFormatada,
        tipo: tipoBatida,
        fotoSelfie: fotoBase64,
        latitude: latAtual || "Não Autorizado",
        longitude: lonAtual || "Não Autorizado",
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      // Enviar ao banco de dados do Firebase
      database.ref('pontos_registrados').push(registroPonto)
        .then(() => {
          alert(`✅ PONTO REGISTRADO COM SUCESSO!\n\nFuncionário: ${nomeColaborador}\nHorário: ${horaFormatada}\nOperação: ${tipoBatida}`);
          // Resetar tela para o próximo colaborador bater
          document.getElementById('selecaoLoja').value = "";
          configurarFiltroSetores();
        })
        .catch(err => {
          alert("Erro ao salvar no banco de dados. Verifique a internet.");
        });
    }

    // Iniciar carregamento dos dados ao abrir a página
    carregarDadosDoServidor();
  </script>
</body>
</html>
