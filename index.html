<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Ponto - São Raimundo</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f4f1; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .ponto-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,74,38,0.15); border-top: 6px solid #006430; text-align: center; }
    
    h2 { color: #006430; margin-bottom: 5px; font-size: 24px; }
    .sub-titulo { color: #666; margin-bottom: 20px; font-size: 14px; }

    /* Alerta de Status da Internet */
    .status-rede { padding: 8px; border-radius: 6px; font-weight: bold; font-size: 13px; margin-bottom: 15px; display: none; }
    .rede-offline { background: #ffebee; color: #c62828; display: block; }
    .rede-online { background: #e8f5e9; color: #2e7d32; }

    /* Grid de Funcionários com Foto */
    .lista-funcionarios { max-height: 280px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 5px; margin-bottom: 20px; background: #fafafa; }
    .item-colaborador { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; border-radius: 6px; }
    .item-colaborador:hover { background: #e8f5e9; }
    .item-colaborador.selecionado { background: #c8e6c9; border: 1px solid #006430; }
    .foto-perfil { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 2px solid #006430; background: #eee; }
    .nome-colaborador { font-size: 16px; font-weight: bold; color: #333; text-align: left; }

    /* Histórico de Batidas do Dia */
    .bloco-historico { background: #f7fbf7; border: 1px solid #c8e6c9; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: left; display: none; }
    .bloco-historico h4 { margin: 0 0 8px 0; color: #004a26; font-size: 14px; border-bottom: 1px solid #c8e6c9; padding-bottom: 4px; }
    .linha-hist { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; font-weight: bold; }
    .status-ok { color: #2e7d32; }
    .status-pendente { color: #9e9e9e; font-style: italic; }

    select, button { width: 100%; padding: 14px; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    select { border: 1px solid #a5d6a7; margin-bottom: 15px; font-weight: bold; }
    
    .btn-bater { background: #006430; color: white; border: none; font-weight: bold; cursor: pointer; border-bottom: 4px solid #004a26; transition: background 0.1s; }
    .btn-bater:active { transform: scale(0.98); border-bottom-width: 2px; }
    .btn-bater:disabled { background: #9e9e9e; border-bottom-color: #757575; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="ponto-container">
    <h2>SÃO RAIMUNDO</h2>
    <div class="sub-titulo">REGISTRO DIGITAL DE PONTO</div>

    <div id="statusRede" class="status-rede"></div>

    <div class="lista-funcionarios" id="listaColaboradoresContainer">
      </div>

    <div class="bloco-historico" id="blocoHistorico">
      <h4 id="titHist">Histórico de Hoje:</h4>
      <div id="corpoHistorico"></div>
    </div>

    <select id="tipoPonto">
      <option value="Entrada">Entrada Expediente</option>
      <option value="Saída Almoço">Saída para Almoço</option>
      <option value="Retorno Almoço">Retorno do Almoço</option>
      <option value="Saída Fim">Saída Encerramento</option>
    </select>

    <button class="btn-bater" id="btnRegistrar" onclick="tentarRegistrarPonto()">REGISTRAR PONTO</button>
  </div>

  <script>
    // Configuração do seu Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBJMoG89lg9TXxO9z1d8jxbAzGms9Ts1sc",
      authDomain: "meu-ponto-sr.firebaseapp.com",
      databaseURL: "https://meu-ponto-sr-default-rtdb.firebaseio.com",
      projectId: "meu-ponto-sr",
      storageBucket: "meu-ponto-sr.appspot.com",
      messagingSenderId: "356930006135",
      appId: "1:356930006135:web:90bc643a9cd39a38f02a72"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // LISTA DE FUNCIONÁRIOS COM LINKS DE FOTOS (Troque as URLs pelas fotos reais deles)
    const colaboradores = [
      { nome: "Flavio", foto: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" },
      { nome: "Samira", foto: "https://cdn-icons-png.flaticon.com/512/219/219969.png" },
      { nome: "Edmilson", foto: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" },
      { nome: "Raylma", foto: "https://cdn-icons-png.flaticon.com/512/219/219969.png" },
      { nome: "Francisca Souza", foto: "https://cdn-icons-png.flaticon.com/512/219/219969.png" }
      // Adicione os outros aqui seguindo o mesmo modelo padrão
    ];

    let colaboradorSelecionado = "";

    // Renderizar lista de funcionários com foto na tela
    function carregarListaColaboradores() {
      const container = document.getElementById("listaColaboradoresContainer");
      container.innerHTML = "";
      colaboradores.sort((a,b) => a.nome.localeCompare(b.nome)).forEach(c => {
        const div = document.createElement("div");
        div.className = "item-colaborador";
        div.onclick = () => selecionarColaborador(div, c.nome);
        div.innerHTML = `
          <img src="${c.foto}" class="foto-perfil" alt="${c.nome}">
          <span class="nome-colaborador">${c.nome}</span>
        `;
        container.appendChild(div);
      });
    }

    function selecionarColaborador(elemento, nome) {
      document.querySelectorAll(".item-colaborador").forEach(el => el.classList.remove("selecionado"));
      elemento.classList.add("selecionado");
      colaboradorSelecionado = nome;
      buscarHistóricoDoDia(nome);
    }

    // Monitor de Internet (Avisa na tela se cair)
    function atualizarStatusRede() {
      const indicador = document.getElementById("statusRede");
      if (navigator.onLine) {
        indicador.className = "status-rede rede-online";
        indicador.innerText = "⚡ Conectado à Internet";
        setTimeout(() => indicador.style.display = "none", 2000);
        sincronizarPontosOffline(); // Tenta enviar pontos guardados se houver
      } else {
        indicador.className = "status-rede rede-offline";
        indicador.innerText = "⚠️ Modo Offline Ativo (Os pontos serão salvos localmente)";
        indicador.style.display = "block";
      }
    }
    window.addEventListener('online', atualizarStatusRede);
    window.addEventListener('offline', atualizarStatusRede);

    // Renderiza o Histórico de hoje na tela do colaborador
    function buscarHistóricoDoDia(nome) {
      const hoje = new Date();
      const diaChave = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;
      
      document.getElementById("titHist").innerText = `Histórico de Hoje (${hoje.getDate()}/${hoje.getMonth()+1}):`;
      
      // Busca primeiro no banco
      database.ref('pontos_registrados').once('value', snapshot => {
        let pontosDeHoje = { "Entrada": "--", "Saída Almoço": "--", "Retorno Almoço": "--", "Saída Fim": "--" };
        
        snapshot.forEach(child => {
          let p = child.val();
          let pData = p.dataChave || "";
          if(pData.includes('/')) {
            let pt = pData.split('/'); pData = `${pt[2]}-${pt[1]}-${pt[0]}`;
          }
          if (p.colaborador === nome && pData === diaChave) {
            pontosDeHoje[p.tipo] = p.horario;
          }
        });

        // Mescla com o que possa estar retido no offline do aparelho
        let pendentes = JSON.parse(localStorage.getItem("pontos_offline") || "[]");
        pendentes.forEach(p => {
          if(p.colaborador === nome && p.dataChave === diaChave) {
            pontosDeHoje[p.tipo] = p.horario + " (Aguardando Wi-Fi)";
          }
        });

        const containerHist = document.getElementById("corpoHistorico");
        containerHist.innerHTML = "";
        
        // Define automaticamente a sugestão do próximo ponto lógico no Select
        let proximoSugerido = "Entrada";

        Object.keys(pontosDeHoje).forEach(tipo => {
          let hora = pontosDeHoje[tipo];
          let classe = hora !== "--" ? "status-ok" : "status-pendente";
          if(hora === "--" && proximoSugerido === "Entrada") { proximoSugerido = tipo; }
          else if(pontosDeHoje["Entrada"] !== "--" && pontosDeHoje["Saída Almoço"] === "--") { proximoSugerido = "Saída Almoço"; }
          else if(pontosDeHoje["Saída Almoço"] !== "--" && pontosDeHoje["Retorno Almoço"] === "--") { proximoSugerido = "Retorno Almoço"; }
          else if(pontosDeHoje["Retorno Almoço"] !== "--" && pontosDeHoje["Saída Fim"] === "--") { proximoSugerido = "Saída Fim"; }

          containerHist.innerHTML += `
            <div class="linha-hist">
              <span>${tipo}:</span>
              <span class="${classe}">${hora}</span>
            </div>
          `;
        });

        document.getElementById("tipoPonto").value = proximoSugerido;
        document.getElementById("blocoHistorico").style.display = "block";
      });
    }

    // A MÁGICA DO OFFLINE: Registra e gerencia o fluxo de rede
    function tentarRegistrarPonto() {
      if (!colaboradorSelecionado) {
        alert("Por favor, selecione seu nome na lista com foto primeiro!");
        return;
      }

      document.getElementById("btnRegistrar").disabled = true;
      document.getElementById("btnRegistrar").innerText = "Processando...";

      const agora = new Date();
      const dataChave = `${agora.getFullYear()}-${String(agora.getMonth()+1).padStart(2,'0')}-${String(agora.getDate()).padStart(2,'0')}`;
      const dataExibir = `${String(agora.getDate()).padStart(2,'0')}/${String(agora.getMonth()+1).padStart(2,'0')}/${agora.getFullYear()}`;
      const horario = `${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}:${String(agora.getSeconds()).padStart(2,'0')}`;
      const tipo = document.getElementById("tipoPonto").value;

      const dadosPonto = {
        colaborador: colaboradorSelecionado,
        data: dataExibir,
        dataChave: dataChave,
        horario: horario,
        tipo: tipo,
        fotoSelfie: "", // O aplicativo de câmera pode injetar a base64 aqui
        latitude: "-4.4623", // Exemplo Codó-MA
        longitude: "-43.8864"
      };

      if (navigator.onLine) {
        // Envia direto pro Firebase se tiver sinal
        database.ref('pontos_registrados').push(dadosPonto)
          .then(() => {
            alert(`Ponto de ${tipo} batido com SUCESSO às ${horario}!`);
            finalizarBatida();
          })
          .catch(err => {
            guardarNoCacheOffline(dadosPonto);
          });
      } else {
        // Se estiver sem sinal, guarda localmente
        guardarNoCacheOffline(dadosPonto);
      }
    }

    function guardarNoCacheOffline(dados) {
      let fila = JSON.parse(localStorage.getItem("pontos_offline") || "[]");
      fila.push(dados);
      localStorage.setItem("pontos_offline", JSON.stringify(fila));
      alert(`⚠️ Você está Sem Internet! Mas não se preocupe: seu ponto de ${dados.tipo} foi salvo no aparelho e será enviado automaticamente quando o sinal voltar.`);
      finalizarBatida();
    }

    function sincronizarPontosOffline() {
      let fila = JSON.parse(localStorage.getItem("pontos_offline") || "[]");
      if (fila.length === 0) return;

      console.log(`Sincronizando ${fila.length} pontos salvos no modo offline...`);
      
      let promessas = fila.map(ponto => {
        return database.ref('pontos_registrados').push(ponto);
      });

      Promise.all(promessas).then(() => {
        localStorage.removeItem("pontos_offline");
        console.log("Todos os pontos retidos foram sincronizados com sucesso!");
        if(colaboradorSelecionado) buscarHistóricoDoDia(colaboradorSelecionado);
      }).catch(err => console.error("Erro na sincronização automática de rede", err));
    }

    function finalizarBatida() {
      document.getElementById("btnRegistrar").disabled = false;
      document.getElementById("btnRegistrar").innerText = "REGISTRAR PONTO";
      buscarHistóricoDoDia(colaboradorSelecionado);
    }

    // Inicialização
    carregarListaColaboradores();
    atualizarStatusRede();
  </script>
</body>
</html>
