<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Ponto SR</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* --- ESTILO DO APLICATIVO (CSS) --- */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
      margin: 20px auto;
    }

    h1 {
      color: #d32f2f;
      margin-top: 0;
      font-size: 24px;
      letter-spacing: 1px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #d32f2f;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:active {
      background: #b71c1c;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      color: #333;
      font-weight: bold;
    }

    #localizacao {
      margin-top: 15px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
      border: 1px solid #eee;
    }

    /* Estilo do espaço do Mapa */
    #mapa {
      width: 100%;
      height: 200px;
      margin-top: 15px;
      border-radius: 10px;
      border: 2px solid #d32f2f;
      display: none; /* Fica escondido até o ponto ser batido */
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>MEU PONTO SR</h1>

    <p id="status">Nenhum ponto registrado</p>

    <button onclick="registrar('Entrada')">
      Registrar Entrada
    </button>

    <button onclick="registrar('Saída')">
      Registrar Saída
    </button>

    <div id="mapa"></div>

    <div id="localizacao">Aguardando registro...</div>

  </div>

  <script>
    let mapaObjeto = null; // Guarda a instância do mapa para não duplicar

    function registrar(tipo) {
      
      document.getElementById("status").innerHTML = tipo + " registrado com sucesso!";
      document.getElementById("localizacao").innerHTML = "Buscando localização exata...";

      if (navigator.geolocation) {
        
        navigator.geolocation.getCurrentPosition(
          function(posicao) {
            let lat = posicao.coords.latitude;
            let lon = posicao.coords.longitude;

            // 1. Atualiza o texto das coordenadas
            document.getElementById("localizacao").innerHTML = 
              `<strong>GPS Capturado</strong><br>
              Lat: ${lat.toFixed(6)} | Lon: ${lon.toFixed(6)}`;

            // 2. Torna o bloco do mapa visível
            document.getElementById("mapa").style.display = "block";

            // 3. Renderiza ou atualiza o mapa na tela
            if (mapaObjeto === null) {
              // Cria o mapa focado na latitude e longitude do celular (Zoom 16)
              mapaObjeto = L.map('mapa').setView([lat, lon], 16);

              // Carrega o design das ruas (OpenStreetMap)
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
              }).addTo(mapaObjeto);

              // Adiciona o pino indicador no mapa
              L.marker([lat, lon]).addTo(mapaObjeto)
                .bindPopup('Funcionário está aqui')
                .openPopup();
            } else {
              // Se o mapa já existia (ex: bateu entrada e depois saída), só move o foco
              mapaObjeto.setView([lat, lon], 16);
              L.marker([lat, lon]).addTo(mapaObjeto);
            }

            // Força o mapa a se ajustar ao tamanho correto da tela do celular
            setTimeout(() => { mapaObjeto.invalidateSize(); }, 400);
          },
          function(erro) {
            document.getElementById("localizacao").innerHTML = "Erro ao capturar localização.";
            alert("Ative o GPS do celular e dê permissão no navegador.");
          },
          {
            enableHighAccuracy: true,
            timeout: 10000
          }
        );

      } else {
        alert("Seu navegador não suporta GPS.");
      }
    }
  </script>

</body>
</html>
