<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Ponto SR</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
      margin: 20px auto;
    }

    h1 {
      color: #d32f2f;
      margin-top: 0;
      font-size: 24px;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
      text-align: left;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      margin-bottom: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      outline: none;
      box-sizing: border-box;
    }

    select:focus {
      border-color: #d32f2f;
    }

    #bloco-colaborador, #bloco-botoes {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid-botoes {
      display: block;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Cores customizadas para cada tipo de ponto */
    .btn-entrada { background: #2e7d32; } /* Verde */
    .btn-entrada:active { background: #1b5e20; }

    .btn-saida-almoco { background: #f57c00; } /* Laranja */
    .btn-saida-almoco:active { background: #e65100; }

    .btn-retorno-almoco { background: #0288d1; } /* Azul */
    .btn-retorno-almoco:active { background: #01579b; }

    .btn-saida { background: #c62828; } /* Vermelho */
    .btn-saida:active { background: #a91b1b; }

    #status {
      margin-top: 15px;
      font-size: 16px;
      color: #333;
      font-weight: bold;
      background: #fff3e0;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }

    .nuvem-status {
      font-size: 14px;
      color: #2e7d32;
      margin-top: 6px;
      display: none;
      font-weight: bold;
    }

    #localizacao {
      margin-top: 15px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      border: 1px solid #eee;
      text-align: left;
    }

    #mapa {
      width: 100%;
      height: 180px;
      margin-top: 15px;
      border-radius: 10px;
      border: 2px solid #d32f2f;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MEU PONTO SR</h1>

    <label for="setor">1. SELECIONE O SETOR:</label>
    <select id="setor" onchange="filtrarColaboradores()">
      <option value="">-- Escolha o Setor --</option>
      <option value="escritorio">ESCRITÓRIO / ADMINISTRAÇÃO</option>
      <option value="rh">RH / DEPARTAMENTO PESSOAL</option>
      <option value="tesouraria">TESOURARIA</option>
      <option value="caixas">CAIXAS</option>
      <option value="repositores">REPOSITORES</option>
      <option value="almoxarifado">ALMOXARIFADO</option>
      <option value="açougue">AÇOUGUE</option>
      <option value="empacotadores">EMPACOTADORES</option>
      <option value="terceirizados">TERCEIRIZADOS / SEGURANÇA</option>
    </select>

    <div id="bloco-colaborador">
      <label for="colaborador">2. SELECIONE SEU NOME:</label>
      <select id="colaborador" onchange="liberarBotoes()">
        </select>
    </div>

    <div id="bloco-botoes" class="grid-botoes">
      <label style="text-align: center; margin-bottom: 5px; color: #333;">3. REGISTRE SEU PONTO:</label>
      <button class="btn-entrada" onclick="registrar('Entrada Manhã')">🌅 Registrar Entrada</button>
      <button class="btn-saida-almoco" onclick="registrar('Saída Almoço')">🥪 Saída p/ Almoço</button>
      <button class="btn-retorno-almoco" onclick="registrar('Retorno Almoço')">☕ Retorno do Almoço</button>
      <button class="btn-saida" onclick="registrar('Saída Expediente')">🛑 Saída Fim Expediente</button>
    </div>

    <p id="status"></p>
    <p id="nuvem" class="nuvem-status">☁️ Conectando ao Banco...</p>

    <div id="mapa"></div>
    <div id="localizacao">Aguardando registro...</div>
  </div>

  <script>
    // Configurações do seu Firebase Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyBJMoG89lg9TXxO9z1d8jxbAzGms9Ts1sc",
      authDomain: "meu-ponto-sr.firebaseapp.com",
      databaseURL: "https://meu-ponto-sr-default-rtdb.firebaseio.com",
      projectId: "meu-ponto-sr",
      storageBucket: "meu-ponto-sr.appspot.com",
      messagingSenderId: "356930006135",
      appId: "1:356930006135:web:90bc643a9cd39a38f02a72"
    };

    // Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Lista da sua equipe do Supermercado
    const equipe = {
      escritorio: ["Karine"],
      rh: ["Colaborador RH 1"],
      tesouraria: ["Colaborador Tesouraria"],
      caixas: ["Operador de Caixa 1", "Operador de Caixa 2"],
      repositores: ["Eudes", "Repositor 2"],
      almoxarifado: ["Conferente 1"],
      açougue: ["Açougueiro 1"],
      empacotadores: ["Victor"],
      terceirizados: ["Prestador 1"]
    };

    function filtrarColaboradores() {
      const setorSelecionado = document.getElementById("setor").value;
      const blocoColaborador = document.getElementById("bloco-colaborador");
      const seletorColaborador = document.getElementById("colaborador");
      const blocoBotoes = document.getElementById("bloco-botoes");

      seletorColaborador.innerHTML = "";
      blocoBotoes.style.display = "none"; 

      if (setorSelecionado === "") {
        blocoColaborador.style.display = "none";
        return;
      }

      const funcionariosDoSetor = equipe[setorSelecionado];

      let opcaoInicial = document.createElement("option");
      opcaoInicial.value = "";
      opcaoInicial.text = "-- Escolha seu Nome --";
      seletorColaborador.appendChild(opcaoInicial);

      funcionariosDoSetor.forEach(function(nome) {
        let opcao = document.createElement("option");
        opcao.value = nome;
        opcao.text = nome;
        seletorColaborador.appendChild(opcao);
      });

      blocoColaborador.style.display = "block";
    }

    function liberarBotoes() {
      const colaborador = document.getElementById("colaborador").value;
      const blocoBotoes = document.getElementById("bloco-botoes");
      
      if (colaborador !== "") {
        blocoBotoes.style.display = "block";
      } else {
        blocoBotoes.style.display = "none";
      }
    }

    let mapaObjeto = null;

    function registrar(tipo) {
      let setorTexto = document.getElementById("setor").options[document.getElementById("setor").selectedIndex].text;
      let nomeFuncionario = document.getElementById("colaborador").value;

      if (nomeFuncionario === "") {
        alert("Por favor, selecione seu nome antes de registrar!");
        return;
      }
      
      let agora = new Date();
      let dataFormatada = agora.toLocaleDateString('pt-BR'); // Ex: 24/05/2026
      let horaFormatada = agora.toLocaleTimeString('pt-BR'); // Ex: 20:05:32

      // Cria uma chave organizada para busca no painel (ano-mes-dia)
      let ano = agora.getFullYear();
      let mes = String(agora.getMonth() + 1).padStart(2, '0');
      let dia = String(agora.getDate()).padStart(2, '0');
      let dataChave = `${ano}-${mes}-${dia}`;

      const elementoStatus = document.getElementById("status");
      elementoStatus.style.display = "block";
      elementoStatus.innerHTML = `Processando <strong>${tipo}</strong> de <strong>${nomeFuncionario}</strong>...`;
      
      document.getElementById("localizacao").innerHTML = "Buscando localização exata via GPS...";
      document.getElementById("nuvem").style.display = "block";
      document.getElementById("nuvem").innerHTML = "☁️ Salvando no Realtime Database...";

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(posicao) {
            let lat = posicao.coords.latitude;
            let lon = posicao.coords.longitude;

            elementoStatus.innerHTML = `<strong>${tipo}</strong> de <strong>${nomeFuncionario}</strong> gravado!`;
            
            document.getElementById("localizacao").innerHTML = 
              `⏰ <strong>REGISTRO REALIZADO:</strong><br>
              <strong>Colaborador:</strong> ${nomeFuncionario}<br>
              <strong>Setor:</strong> ${setorTexto}<br>
              <strong>Movimento:</strong> ${tipo}<br>
              <strong>Data:</strong> ${dataFormatada}<br>
              <strong>Horário:</strong> ${horaFormatada}<br>
              <strong>GPS:</strong> Lat ${lat.toFixed(6)} | Lon ${lon.toFixed(6)}`;

            document.getElementById("mapa").style.display = "block";

            if (mapaObjeto === null) {
              mapaObjeto = L.map('mapa').setView([lat, lon], 16);
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
              }).addTo(mapaObjeto);
            }
            
            mapaObjeto.setView([lat, lon], 16);
            L.marker([lat, lon]).addTo(mapaObjeto).bindPopup(`${nomeFuncionario} - ${tipo}`).openPopup();
            
            setTimeout(() => { mapaObjeto.invalidateSize(); }, 400);

            // =========================================================
            // GRAVAÇÃO ESTRUTURADA PARA O PAINEL DE CONTROLE
            // =========================================================
            let novoPontoRef = database.ref('pontos_registrados').push();
            novoPontoRef.set({
              colaborador: nomeFuncionario,
              setor: setorTexto,
              tipo: tipo,
              data: dataFormatada,
              dataChave: dataChave, // Ajuda o painel administrativo a filtrar por data
              horario: horaFormatada,
              latitude: lat,
              longitude: lon,
              timestamp: firebase.database.ServerValue.TIMESTAMP
            }, function(error) {
              if (error) {
                console.error("Erro ao salvar:", error);
                document.getElementById("nuvem").innerHTML = "❌ Erro ao salvar na nuvem.";
              } else {
                document.getElementById("nuvem").innerHTML = "✅ Sincronizado com o Meu Ponto SR!";
              }
            });

          },
          function(erro) {
            document.getElementById("localizacao").innerHTML = "Erro ao capturar localização.";
            document.getElementById("nuvem").style.display = "none";
            alert("Por favor, ative o GPS do celular e dê permissão de localização.");
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        alert("Seu navegador não suporta GPS.");
      }
    }
  </script>

</body>
</html>
