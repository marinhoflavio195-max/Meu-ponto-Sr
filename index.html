  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f4f1; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .ponto-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,74,38,0.15); border-top: 6px solid #006430; text-align: center; }
    
    h2 { color: #006430; margin-bottom: 5px; font-size: 24px; letter-spacing: 1px; }
    .sub-titulo { color: #666; margin-bottom: 20px; font-size: 14px; font-weight: bold; }

    /* Alerta de Status da Internet */
    .status-rede { padding: 8px; border-radius: 6px; font-weight: bold; font-size: 13px; margin-bottom: 15px; display: none; }
    .rede-offline { background: #ffebee; color: #c62828; display: block; }
    .rede-online { background: #e8f5e9; color: #2e7d32; }

    /* Buscador e Lista de Funcionários por Setor */
    .campo-busca { width: 100%; padding: 12px; border: 1px solid #a5d6a7; border-radius: 6px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; font-weight: bold; }
    .lista-funcionarios { max-height: 250px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 5px; margin-bottom: 20px; background: #fafafa; }
    
    .header-setor { background: #006430; color: white; padding: 6px 10px; font-size: 12px; font-weight: bold; text-align: left; border-radius: 4px; margin-top: 10px; margin-bottom: 5px; letter-spacing: 0.5px; }
    
    .item-colaborador { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; border-radius: 6px; }
    .item-colaborador:hover { background: #e8f5e9; }
    .item-colaborador.selecionado { background: #c8e6c9; border: 1px solid #006430; }
    .foto-perfil { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 2px solid #ffd700; background: #eee; }
    .nome-colaborador { font-size: 15px; font-weight: bold; color: #333; text-align: left; }

    /* Histórico de Batidas do Dia */
    .bloco-historico { background: #f7fbf7; border: 1px solid #c8e6c9; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: left; display: none; }
    .bloco-historico h4 { margin: 0 0 8px 0; color: #004a26; font-size: 14px; border-bottom: 1px solid #c8e6c9; padding-bottom: 4px; }
    .linha-hist { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; font-weight: bold; }
    .status-ok { color: #2e7d32; }
    .status-pendente { color: #9e9e9e; font-style: italic; }

    /* Área dos Botões de Batida Sequenciais */
    .area-botoes-ponto { display: none; margin-top: 15px; flex-direction: column; gap: 10px; }
    .btn-ponto { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: background 0.2s; display: none; }
    
    .btn-entrada { background-color: #2e7d32; border-bottom: 4px solid #1b5e20; }
    .btn-saida-alm { background-color: #f57c00; border-bottom: 4px solid #e65100; }
    .btn-retorno-alm { background-color: #0288d1; border-bottom: 4px solid #01579b; }
    .btn-saida-fim { background-color: #d32f2f; border-bottom: 4px solid #b71c1c; }

    .btn-ponto:active { transform: scale(0.98); border-bottom-width: 2px; }
    .btn-ponto:disabled { background: #9e9e9e !important; border-bottom-color: #757575 !important; cursor: not-allowed; }
  </style>
</head>

    let colaboradorSelecionado = "";

    // Organizar e carregar a lista dividida por Setores na tela
    function carregarListaColaboradores(filtro = "") {
      const container = document.getElementById("listaColaboradoresContainer");
      container.innerHTML = "";

      // Agrupa por setor
      const setores = {};
      colaboradores.forEach(c => {
        if (filtro && !c.nome.toLowerCase().includes(filtro.toLowerCase())) return;
        if (!setores[c.setor]) setores[c.setor] = [];
        setores[c.setor].push(c);
      });

      Object.keys(setores).forEach(nomeSetor => {
        if (setores[nomeSetor].length === 0) return;

        // Título do Setor
        const header = document.createElement("div");
        header.className = "header-setor";
        header.innerText = nomeSetor;
        container.appendChild(header);

        // Funcionários do Setor
        setores[nomeSetor].sort((a,b) => a.nome.localeCompare(b.nome)).forEach(c => {
          const div = document.createElement("div");
          div.className = "item-colaborador" + (colaboradorSelecionado === c.nome ? " selecionado" : "");
          div.id = `func-${c.nome.replace(/\s+/g, '')}`;
          div.onclick = () => selecionarColaborador(div, c.nome);
          div.innerHTML = `
            <img src="${c.foto}" class="foto-perfil" alt="${c.nome}">
            <span class="nome-colaborador">${c.nome}</span>
          `;
          container.appendChild(div);
        });
      });
    }

    function filtrarFuncionarios() {
      const texto = document.getElementById("inputBusca").value;
      carregarListaColaboradores(texto);
    }

    function selecionarColaborador(elemento, nome) {
      document.querySelectorAll(".item-colaborador").forEach(el => el.classList.remove("selecionado"));
      elemento.classList.add("selecionado");
      colaboradorSelecionado = nome;
      buscarHistoricoESequenciaBotoes(nome);
    }

    // Monitor do Status da Rede (Online/Offline)
    function atualizarStatusRede() {
      const indicador = document.getElementById("statusRede");
      if (navigator.onLine) {
        indicador.className = "status-rede rede-online";
        indicador.innerText = "⚡ Conectado à Internet";
        setTimeout(() => indicador.style.display = "none", 2000);
        sincronizarPontosOffline();
      } else {
        indicador.className = "status-rede rede-offline";
        indicador.innerText = "⚠️ Modo Offline Ativo (Os pontos serão salvos localmente)";
        indicador.style.display = "block";
      }
    }
    window.addEventListener('online', atualizarStatusRede);
    window.addEventListener('offline', atualizarStatusRede);

    // LÓGICA DO SEU CÓDIGO ANTERIOR: Gerencia os botões sequenciais na tela
    function buscarHistoricoESequenciaBotoes(nome) {
      const hoje = new Date();
      const diaChave = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;
      
      document.getElementById("titHist").innerText = `Suas batidas de hoje (${hoje.getDate()}/${hoje.getMonth()+1}):`;
      
      database.ref('pontos_registrados').once('value', snapshot => {
        let pontosDeHoje = { "Entrada": "--", "Saída Almoço": "--", "Retorno Almoço": "--", "Saída Fim": "--" };
        
        snapshot.forEach(child => {
          let p = child.val();
          let pData = p.dataChave || "";
          if(pData.includes('/')) {
            let pt = pData.split('/'); pData = `${pt[2]}-${pt[1]}-${pt[0]}`;
          }
          if (p.colaborador === nome && pData === diaChave) {
            pontosDeHoje[p.tipo] = p.horario;
          }
        });

        // Junta pontos travados na memória offline do celular
        let pendentes = JSON.parse(localStorage.getItem("pontos_offline") || "[]");
        pendentes.forEach(p => {
          if(p.colaborador === nome && p.dataChave === diaChave) {
            pontosDeHoje[p.tipo] = p.horario + " (Aguardando Internet)";
          }
        });

        // Renderiza o histórico visual
        const containerHist = document.getElementById("corpoHistorico");
        containerHist.innerHTML = "";
        Object.keys(pontosDeHoje).forEach(tipo => {
          let hora = pontosDeHoje[tipo];
          let classe = hora !== "--" ? "status-ok" : "status-pendente";
          containerHist.innerHTML += `
            <div class="linha-hist">
              <span>${tipo}:</span>
              <span class="${classe}">${hora}</span>
            </div>
          `;
        });
        document.getElementById("blocoHistorico").style.display = "block";

        // ESCONDE E MOSTRA OS BOTÕES EM SEQUÊNCIA EXATA (Igual ao seu sistema anterior)
        document.querySelectorAll(".btn-ponto").forEach(btn => btn.style.display = "none");
        
        if (pontosDeHoje["Entrada"] === "--") {
          document.getElementById("btn-Entrada").style.display = "block";
        } else if (pontosDeHoje["Saída Almoço"] === "--") {
          document.getElementById("btn-Saída Almoço").style.display = "block";
        } else if (pontosDeHoje["Retorno Almoço"] === "--") {
          document.getElementById("btn-Retorno Almoço").style.display = "block";
        } else if (pontosDeHoje["Saída Fim"] === "--") {
          document.getElementById("btn-Saída Fim").style.display = "block";
        }

        document.getElementById("areaBotoes").style.display = "flex";
      });
    }

    // REGISTRO DO PONTO COM MECANISMO ANTI-QUEDA DE SINAL
    function tentarRegistrarPonto(tipo) {
      if (!colaboradorSelecionado) return;

      const botaoClicado = document.getElementById(`btn-${tipo}`);
      botaoClicado.disabled = true;
      botaoClicado.innerText = "REGISTRANDO...";

      const agora = new Date();
      const dataChave = `${agora.getFullYear()}-${String(agora.getMonth()+1).padStart(2,'0')}-${String(agora.getDate()).padStart(2,'0')}`;
      const dataExibir = `${String(agora.getDate()).padStart(2,'0')}/${String(agora.getMonth()+1).padStart(2,'0')}/${agora.getFullYear()}`;
      const horario = `${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}:${String(agora.getSeconds()).padStart(2,'0')}`;

      const dadosPonto = {
        colaborador: colaboradorSelecionado,
        data: dataExibir,
        dataChave: dataChave,
        horario: horario,
        tipo: tipo,
        fotoSelfie: "", 
        latitude: "-4.4623", 
        longitude: "-43.8864"
      };

      if (navigator.onLine) {
        database.ref('pontos_registrados').push(dadosPonto)
          .then(() => {
            alert(`Sucesso! Ponto de ${tipo} registrado às ${horario}.`);
            finalizarProcessoBatida();
          })
          .catch(() => {
            guardarNoCacheOffline(dadosPonto);
          });
      } else {
        guardarNoCacheOffline(dadosPonto);
      }
    }

    function guardarNoCacheOffline(dados) {
      let fila = JSON.parse(localStorage.getItem("pontos_offline") || "[]");
      fila.push(dados);
      localStorage.setItem("pontos_offline", JSON.stringify(fila));
      alert(`Ponto salvo no aparelho! Sem Wi-Fi no momento, mas o registro de ${dados.tipo} foi armazenado e subirá sozinho assim que a internet voltar.`);
      finalizarProcessoBatida();
    }

    function sincronizarPontosOffline() {
      let fila = JSON.parse(localStorage.getItem("pontos_offline") || "[]");
      if (fila.length === 0) return;

      let promessas = fila.map(p => database.ref('pontos_registrados').push(p));

      Promise.all(promessas).then(() => {
        localStorage.removeItem("pontos_offline");
        if(colaboradorSelecionado) buscarHistoricoESequenciaBotoes(colaboradorSelecionado);
      }).catch(err => console.log("Aguardando rede firme para sincronização...", err));
    }

    function finalizarProcessoBatida() {
      // Reativa todos os botões para a próxima pessoa usar
      document.querySelectorAll(".btn-ponto").forEach(btn => {
        btn.disabled = false;
        if(btn.id === "btn-Entrada") btn.innerText = "➡️ ENTRADA EXPEDIENTE";
        if(btn.id === "btn-Saída Almoço") btn.innerText = "🥪 SAÍDA PARA ALMOÇO";
        if(btn.id === "btn-Retorno Almoço") btn.innerText = "↩️ RETORNO DO ALMOÇO";
        if(btn.id === "btn-Saída Fim") btn.innerText = "🛑 SAÍDA ENCERRAMENTO";
      });
      buscarHistoricoESequenciaBotoes(colaboradorSelecionado);
    }

    // Inicialização do sistema
    carregarListaColaboradores();
    atualizarStatusRede();
  </script>
