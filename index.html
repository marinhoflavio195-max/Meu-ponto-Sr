<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Ponto - São Raimundo</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    /* Mudança global para a nova paleta de cores (Vermelho) */
    body { font-family: Arial, sans-serif; background-color: #fcebee; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .container-ponto { width: 100%; max-width: 450px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(186,12,12,0.15); border-top: 6px solid #d32f2f; box-sizing: border-box; }
    
    /* Área de inserção de Logos */
    .area-logo-topo { text-align: center; margin-bottom: 15px; background-color: #ffffff; padding: 10px; border-radius: 8px; }
    .area-logo-rodape { text-align: center; margin-top: 20px; background-color: #ffffff; padding: 10px; border-radius: 8px; border-top: 1px solid #eee; }
    .logo-img { max-width: 100%; height: auto; max-height: 90px; object-fit: contain; }

    h2 { color: #d32f2f; text-align: center; margin-top: 0; margin-bottom: 5px; font-size: 22px; letter-spacing: 0.5px; }
    .subtitulo { text-align: center; color: #555; font-size: 13px; margin-bottom: 25px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #ffd700; padding-bottom: 8px; }
    
    .campo-grupo { margin-bottom: 18px; }
    .campo-grupo label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #b71c1c; }
    .campo-grupo select { width: 100%; padding: 12px; border: 2px solid #ef9a9a; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #ffffff; color: #333; font-weight: bold; transition: border-color 0.2s; }
    .campo-grupo select:focus { border-color: #d32f2f; outline: none; }
    .campo-grupo select:disabled { background-color: #f5f5f5; border-color: #e0e0e0; color: #999; }
    
    .status-gps { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 15px; display: none; }
    .gps-sucesso { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .gps-erro { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

    .area-camera { display: none; text-align: center; margin-top: 20px; border-top: 2px dashed #ef9a9a; padding-top: 20px; }
    #video { width: 100%; max-width: 320px; height: auto; border-radius: 8px; border: 3px solid #d32f2f; background: #222; transform: scaleX(-1); }
    #canvas { display: none; }
    
    .btn-bater { width: 100%; padding: 15px; background-color: #d32f2f; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: background 0.2s; }
    .btn-bater:hover { background-color: #b71c1c; }
    
    #statusCarregamentoInicial { text-align: center; color: #d32f2f; font-weight: bold; font-size: 14px; margin-bottom: 15px; background: #ffebee; padding: 8px; border-radius: 6px; }

    /* --- ESTILIZAÇÃO DO BOTÃO E MODAL DE SUPORTE --- */
    .btn-suporte-flutuante { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background-color: #d32f2f; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 9999; user-select: none; transition: transform 0.2s; }
    .btn-suporte-flutuante:hover { transform: scale(1.1); background-color: #b71c1c; }
    
    .modal-suporte { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10000; }
    .conteudo-modal { background: white; padding: 25px; border-radius: 12px; max-width: 320px; width: 85%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; }
    .conteudo-modal h3 { margin-top: 0; color: #d32f2f; font-size: 18px; }
    .conteudo-modal p { color: #555; font-size: 14px; line-height: 1.5; margin: 10px 0; }
    
    .btn-wpp-suporte { display: inline-flex; align-items: center; justify-content: center; background-color: #25d366; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; margin-top: 15px; font-size: 15px; width: 100%; box-sizing: border-box; }
    .btn-wpp-suporte:hover { background-color: #128c7e; }
    
    .btn-fechar-modal { background: #eee; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; color: #666; font-weight: bold; margin-top: 10px; width: 100%; }
    .btn-fechar-modal:hover { background: #ddd; }
  </style>
</head>
<body>

  <div class="container-ponto">
    <div class="area-logo-topo">
      <img src="SUA_LOGO_AQUI.jpg" alt="Logo São Raimundo Topo" class="logo-img" onerror="this.style.display='none';">
    </div>

    <h2>SUPERMERCADO SÃO RAIMUNDO</h2>
    <div class="subtitulo">Registro de Ponto com Trava GPS</div>

    <div id="statusCarregamentoInicial">🔄 Sincronizando dados com o servidor...</div>

    <div class="campo-grupo">
      <label for="selecaoLoja">1. SELECIONE A SUA LOJA:</label>
      <select id="selecaoLoja" onchange="configurarFiltroSetores()" disabled>
        <option value="">-- Carregando sistema... --</option>
      </select>
    </div>

    <div class="campo-grupo">
      <label for="selecaoSetor">2. SELECIONE O SEU SETOR:</label>
      <select id="selecaoSetor" onchange="configurarFiltroNomes()" disabled>
        <option value="">-- Aguardando Loja... --</option>
      </select>
    </div>

    <div class="campo-grupo">
      <label for="selecaoNome">3. SELECIONE SEU NOME COMPLETO:</label>
      <select id="selecaoNome" onchange="verificarLocalizacaoEValida()" disabled>
        <option value="">-- Aguardando Setor... --</option>
      </select>
    </div>

    <div class="campo-grupo" id="grupoTipoBatida" style="display: none;">
      <label for="selecaoTipo">4. O QUE ESTÁ REGISTRANDO AGORA?</label>
      <select id="selecaoTipo"></select>
    </div>

    <div id="caixaStatusGps" class="status-gps"></div>

    <div class="area-camera" id="blocoValidacao">
      <label style="display:block; font-weight:bold; color:#b71c1c; margin-bottom:10px;">OLHE PARA A CÂMERA PARA CONFIRMAÇÃO:</label>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" width="320" height="240"></canvas>
      
      <button id="btnRegistrarPonto" class="btn-bater" onclick="registrarPontoFinal()">📸 CONFIRMAR E REGISTRAR PONTO</button>
    </div>

    <div class="area-logo-rodape">
      <img src="SUA_LOGO_AQUI.jpg" alt="Logo São Raimundo Rodapé" class="logo-img" onerror="this.style.display='none';">
    </div>
  </div>

  <div class="btn-suporte-flutuante" onclick="abrirModalSuporte()">?</div>

  <div class="modal-suporte" id="janelaModalSuporte">
    <div class="conteudo-modal">
      <h3>Suporte Técnico</h3>
      <p>Precisando de ajuda com o sistema de batimento de ponto?</p>
      
      <a href="https://wa.me/5599988592997?text=Olá%20Flávio,%20estou%20com%20uma%20dúvida%20no%20sistema%20de%20ponto." target="_blank" class="btn-wpp-suporte">
        💬 Chamar no WhatsApp
      </a>
      
      <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
      <p style="font-size: 11px; color: #999; margin: 0;">
        <strong>Aplicativo:</strong> Ponto Interno SR<br>
        <strong>Ano de Criação:</strong> 2026<br>
        <strong>Versão:</strong> 0.10
      </p>
      
      <button class="btn-fechar-modal" onclick="fecharModalSuporte()">Fechar</button>
    </div>
  </div>

  <script>
    /* Funções do Modal de Suporte */
    function abrirModalSuporte() {
      document.getElementById('janelaModalSuporte').style.display = 'flex';
    }
    function fecharModalSuporte() {
      document.getElementById('janelaModalSuporte').style.display = 'none';
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBJMoG89lg9TXxO9z1d8jxbAzGms9Ts1sc",
      authDomain: "meu-ponto-sr.firebaseapp.com",
      databaseURL: "https://meu-ponto-sr-default-rtdb.firebaseio.com",
      projectId: "meu-ponto-sr",
      storageBucket: "meu-ponto-sr.appspot.com",
      messagingSenderId: "356930006135",
      appId: "1:356930006135:web:90bc643a9cd39a38f02a72"
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    const coordenadasLojas = {
      "1": { lat: -4.4515049, lon: -43.8762104 },
      "2": { lat: -4.4680240, lon: -43.8895061 },
      "3": { lat: -4.4665202, lon: -43.8833122 },
      "4": { lat: -4.4514327, lon: -43.8758061 }
    };

    const RAIO_MAXIMO_METROS = 100; 
    let funcionariosMemoria = {};
    let streamCamera = null;
    let latAtual = null;
    let lonAtual = null;

    function carregarDadosDoServidor() {
      database.ref('config_funcionarios').on('value', snapshot => {
        if(snapshot.exists()) {
          funcionariosMemoria = snapshot.val();
          const comboLoja = document.getElementById('selecaoLoja');
          comboLoja.innerHTML = `
            <option value="">-- Escolha a Loja --</option>
            <option value="1">Loja 1 (Centro)</option>
            <option value="2">Loja 2</option>
            <option value="3">Loja 3</option>
            <option value="4">Loja 4 (SR Moto Peças)</option>
          `;
          comboLoja.disabled = false;
          document.getElementById('statusCarregamentoInicial').style.display = 'none';
        } else {
          document.getElementById('statusCarregamentoInicial').innerHTML = "⚠️ Nenhuma configuração de funcionário encontrada no Firebase.";
        }
      }, erro => {
        document.getElementById('statusCarregamentoInicial').style.backgroundColor = "#ffebee";
        document.getElementById('statusCarregamentoInicial').style.color = "#c62828";
        document.getElementById('statusCarregamentoInicial').innerHTML = `❌ Erro de Permissão: Verifique as Regras do Firebase. (${erro.code})`;
      });
    }

    function configurarFiltroSetores() {
      const lojaSelecionada = document.getElementById('selecaoLoja').value;
      const comboSetor = document.getElementById('selecaoSetor');
      const comboNome = document.getElementById('selecaoNome');
      
      comboSetor.innerHTML = '<option value="">-- Escolha o Setor --</option>';
      comboNome.innerHTML = '<option value="">-- Aguardando Setor... --</option>';
      comboSetor.disabled = true; 
      comboNome.disabled = true;
      fecharCamera();

      if(!lojaSelecionada) return;

      let setoresUnicos = new Set();
      Object.keys(funcionariosMemoria).forEach(nome => {
        if(String(funcionariosMemoria[nome].loja) === String(lojaSelecionada)) {
          setoresUnicos.add(funcionariosMemoria[nome].setor);
        }
      });

      Array.from(setoresUnicos).sort().forEach(setor => {
        comboSetor.innerHTML += `<option value="${setor}">${setor}</option>`;
      });
      comboSetor.disabled = false;
    }

    function configurarFiltroNomes() {
      const lojaSelecionada = document.getElementById('selecaoLoja').value;
      const comboSetor = document.getElementById('selecaoSetor').value;
      const comboNome = document.getElementById('selecaoNome');

      comboNome.innerHTML = '<option value="">-- Escolha seu Nome --</option>';
      comboNome.disabled = true;
      fecharCamera();

      if(!comboSetor) return;

      Object.keys(funcionariosMemoria).sort().forEach(nome => {
        let f = funcionariosMemoria[nome];
        if(String(f.loja) === String(lojaSelecionada) && f.setor === comboSetor) {
          comboNome.innerHTML += `<option value="${nome}">${nome}</option>`;
        }
      });
      comboNome.disabled = false;
    }

    function analisarBatidasDoDia(nomeColaborador) {
      const comboTipo = document.getElementById('selecaoTipo');
      const statusBox = document.getElementById('caixaStatusGps');
      const btnRegistrar = document.getElementById('btnRegistrarPonto');
      const blocoValidacao = document.getElementById('blocoValidacao');
      
      const agora = new Date();
      const diaStr = String(agora.getDate()).padStart(2, '0');
      const mesStr = String(agora.getMonth() + 1).padStart(2, '0');
      const anoStr = agora.getFullYear();
      const dataChaveHoje = `${anoStr}-${mesStr}-${diaStr}`;

      comboTipo.innerHTML = '<option value="">Analisando histórico de hoje...</option>';

      database.ref('pontos_registrados')
        .orderByChild('dataChave')
        .equalTo(dataChaveHoje)
        .once('value', snapshot => {
          let batidasEfetivadas = [];
          
          if(snapshot.exists()) {
            snapshot.forEach(child => {
              const registro = child.val();
              if(registro.colaborador && registro.colaborador.toUpperCase() === nomeColaborador.toUpperCase()) {
                batidasEfetivadas.push(registro.tipo);
              }
            });
          }

          let jaCompletouTudo = false;

          if (!batidasEfetivadas.includes("Entrada Expediente")) {
            comboTipo.innerHTML = `<option value="Entrada Expediente">Entrada Expediente</option>`;
          } 
          else if (!batidasEfetivadas.includes("Saida Almoço")) {
            comboTipo.innerHTML = `<option value="Saida Almoço">Saída para Almoço</option>`;
          } 
          else if (!batidasEfetivadas.includes("Retorno Almoço")) {
            comboTipo.innerHTML = `<option value="Retorno Almoço">Retorno do Almoço</option>`;
          } 
          else if (!batidasEfetivadas.includes("Saida Fim")) {
            comboTipo.innerHTML = `<option value="Saida Fim">Saída Fim de Expediente</option>`;
          } 
          else {
            jaCompletouTudo = true;
          }

          if (jaCompletouTudo) {
            comboTipo.innerHTML = `<option value="COMPLETO">Expediente Total Concluído!</option>`;
            statusBox.style.display = 'block';
            statusBox.className = "status-gps gps-sucesso";
            statusBox.innerHTML = `✅ Seus 4 pontos de hoje já estão no sistema, ${nomeColaborador}!`;
            blocoValidacao.style.display = 'none';
            fecharCameraApenas();
          } else {
            blocoValidacao.style.display = 'block';
            btnRegistrar.disabled = false;
            abrirCameraAparato();
          }
        });
    }

    function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const deltaPhi = (lat2 - lat1) * Math.PI / 180;
      const deltaLambda = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))); 
    }

    function verificarLocalizacaoEValida() {
      const nomeSel = document.getElementById('selecaoNome').value;
      const lojaSel = document.getElementById('selecaoLoja').value;
      const statusBox = document.getElementById('caixaStatusGps');
      const blocoValidacao = document.getElementById('blocoValidacao');

      if(!nomeSel) { fecharCamera(); return; }

      statusBox.style.display = 'block';
      statusBox.className = "status-gps gps-erro";
      statusBox.innerHTML = "📡 Obtendo localização precisa do GPS...";
      blocoValidacao.style.display = 'none';

      if (!navigator.geolocation) {
        statusBox.innerHTML = "❌ Erro: Seu aparelho não suporta Geolocalização.";
        return;
      }

      navigator.geolocation.getCurrentPosition(position => {
        latAtual = position.coords.latitude;
        lonAtual = position.coords.longitude;

        const alvo = coordenadasLojas[lojaSel];
        const distanciaM = calcularDistanciaMetros(latAtual, lonAtual, alvo.lat, alvo.lon);

        if(distanciaM <= RAIO_MAXIMO_METROS) {
          statusBox.className = "status-gps gps-sucesso";
          statusBox.innerHTML = `✅ Perímetro Confirmado!`;
          document.getElementById('grupoTipoBatida').style.display = 'block';
          analisarBatidasDoDia(nomeSel);
        } else {
          statusBox.className = "status-gps gps-erro";
          statusBox.innerHTML = `⚠️ Fora do perímetro da loja! Distância: ${Math.round(distanciaM)}m.`;
          fecharCameraApenas();
        }
      }, err => {
        statusBox.className = "status-gps gps-erro";
        statusBox.innerHTML = "❌ Ative a localização/GPS do seu aparelho para bater o ponto.";
        fecharCameraApenas();
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    function abrirCameraAparato() {
      const video = document.getElementById('video');
      if(!streamCamera) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
          .then(stream => {
            streamCamera = stream;
            video.srcObject = stream;
            video.setAttribute('playsinline', true);
            video.play().catch(e => console.log("Erro de autoplay"));
          }).catch(err => { 
            alert("⚠️ Permissão de Câmera Negada! Ative o acesso à câmera nas configurações do seu navegador."); 
          });
      }
    }

    function fecharCamera() {
      document.getElementById('caixaStatusGps').style.display = 'none';
      fecharCameraApenas();
    }

    function fecharCameraApenas() {
      document.getElementById('blocoValidacao').style.display = 'none';
      document.getElementById('grupoTipoBatida').style.display = 'none';
      if(streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
        streamCamera = null;
      }
    }

    function registrarPontoFinal() {
      const nomeColaborador = document.getElementById('selecaoNome').value;
      const tipoBatida = document.getElementById('selecaoTipo').value;
      const lojaAtual = document.getElementById('selecaoLoja').value;
      const setorAtual = document.getElementById('selecaoSetor').value;

      if(tipoBatida === "COMPLETO" || !tipoBatida) return;

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
      } catch(e) {
        var fotoBase64 = "";
      }

      const agora = new Date();
      const diaStr = String(agora.getDate()).padStart(2, '0');
      const mesStr = String(agora.getMonth() + 1).padStart(2, '0');
      const anoStr = agora.getFullYear();
      
      const dataFormatada = `${diaStr}/${mesStr}/${anoStr}`;
      const horaFormatada = agora.toTimeString().split(' ')[0];
      const dataChave = `${anoStr}-${mesStr}-${diaStr}`;

      const registroPonto = {
        colaborador: nomeColaborador,
        loja: lojaAtual,
        setor: setorAtual,
        data: dataFormatada,
        dataChave: dataChave,
        horario: horaFormatada,
        tipo: tipoBatida,
        fotoSelfie: fotoBase64,
        latitude: latAtual,
        longitude: lonAtual,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      database.ref('pontos_registrados').push(registroPonto)
        .then(() => {
          alert(`✅ PONTO REGISTRADO COM SUCESSO!\n\n${nomeColaborador}\nHorário: ${horaFormatada}`);
          document.getElementById('selecaoLoja').value = "";
          configurarFiltroSetores();
        })
        .catch(err => { alert("Erro ao salvar no banco."); });
    }

    carregarDadosDoServidor();
  </script>
</body>
</html>
