
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Ponto SR</title>
  
  <style>
    /* --- ESTILO DO APLICATIVO (CSS) --- */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: #d32f2f;
      margin-top: 0;
      font-size: 24px;
      letter-spacing: 1px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #d32f2f;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:active {
      background: #b71c1c;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
      font-weight: 500;
    }

    #localizacao {
      margin-top: 25px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
      line-height: 1.5;
      border: 1px solid #eee;
    }
  </style>
</head>
<body>

  <!-- --- ESTRUTURA DA TELA (HTML) --- -->
  <div class="container">

    <h1>MEU PONTO SR</h1>

    <p id="status">Nenhum ponto registrado</p>

    <button onclick="registrar('Entrada')">
      Registrar Entrada
    </button>

    <button onclick="registrar('Saída')">
      Registrar Saída
    </button>

    <div id="localizacao">Aguardando registro...</div>

  </div>

  <!-- --- LÓGICA DO GPS E BOTÕES (JAVASCRIPT) --- -->
  <script>
    function registrar(tipo) {
      
      // Dá um feedback imediato na tela para o usuário
      document.getElementById("status").innerHTML = tipo + " registrado com sucesso!";
      document.getElementById("localizacao").innerHTML = "Buscando satélite GPS...";

      // Verifica se o celular/navegador tem suporte a localização
      if (navigator.geolocation) {
        
        navigator.geolocation.getCurrentPosition(
          function(posicao) {
            let lat = posicao.coords.latitude;
            let lon = posicao.coords.longitude;

            // Mostra as coordenadas formatadas na tela
            document.getElementById("localizacao").innerHTML = 
              `<strong>GPS Capturado com Sucesso</strong><br>
              Lat: ${lat.toFixed(6)}<br>
              Lon: ${lon.toFixed(6)}`;
          },
          function(erro) {
            // Caso o GPS esteja desligado ou o navegador bloqueie
            document.getElementById("localizacao").innerHTML = "Erro ao capturar localização.";
            alert("Erro ao pegar GPS. Ative a localização do celular e dê permissão nas configurações do navegador.");
          },
          {
            enableHighAccuracy: true, // Força o celular a usar o GPS de alta precisão
            timeout: 10000            // Aguarda até 10 segundos pelo sinal
          }
        );

      } else {
        alert("Seu navegador não suporta captura de GPS.");
      }
    }
  </script>

</body>
</html>
