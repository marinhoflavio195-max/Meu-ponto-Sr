<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Ponto - Supermercado São Raimundo</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f3f7f4; margin: 0; padding: 20px; color: #333; }
    .painel-container { width: 100%; max-width: 1300px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,100,48,0.08); box-sizing: border-box; border-top: 6px solid #006430; }
    
    h1 { color: #006430; margin-top: 0; border-bottom: 3px solid #ffd700; padding-bottom: 12px; font-size: 26px; font-weight: 700; }
    
    .filtros-topo { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; background: #f9fdfa; padding: 20px; border-radius: 8px; border: 1px solid #c8e6c9; }
    .campo-filtro { flex: 1; min-width: 220px; }
    .campo-filtro label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 6px; color: #004a26; text-transform: uppercase; }
    .campo-filtro select, .campo-filtro input { width: 100%; padding: 10px; border: 1px solid #a5d6a7; border-radius: 6px; font-size: 14px; box-sizing: border-box; background-color: white; }
    
    .botoes-acoes { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    
    .btn-filtrar { background-color: #006430; }
    .btn-filtrar:hover { background-color: #004a26; }
    .btn-excel { background-color: #2e7d32; }
    .btn-excel:hover { background-color: #1b5e20; }
    .btn-pdf { background-color: #0b5394; }
    .btn-pdf:hover { background-color: #073763; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: left; }
    th { background-color: #006430; color: white; padding: 14px 10px; font-size: 13px; border-bottom: 3px solid #ffd700; text-transform: uppercase; }
    td { padding: 12px 10px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    tr:hover { background-color: #f1f8f3; }
    
    .status-falta { color: #c62828; font-weight: bold; background: #ffebee; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    .status-regular { color: #2e7d32; font-weight: bold; }
    
    .bloco-ponto-acoes { display: inline-flex; flex-direction: column; align-items: center; background: #eef4f0; padding: 6px; border-radius: 6px; border: 1px solid #d0dfd5; min-width: 80px; }
    .titulo-hora { font-size: 11px; font-weight: bold; color: #004a26; margin-bottom: 4px; }
    .btn-foto { background: #673ab7; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 2px; }
    .btn-mapa { background: #0b5394; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; width: 100%; text-decoration: none; text-align: center; box-sizing: border-box; display: block; }

    /* Modal de Foto */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
    .modal-content { background-color: white; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; }
    .modal-content img { width: 100%; border-radius: 8px; border: 3px solid #006430; margin-bottom: 15px; }
    .btn-fechar { background: #006430; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <div class="painel-container">
    <h1>SUPERMERCADO SÃO RAIMUNDO - GESTÃO DE PONTOS</h1>

    <div class="filtros-topo">
      <div class="campo-filtro">
        <label for="filtroLoja">Filtrar por Loja:</label>
        <select id="filtroLoja" onchange="atualizarListaFuncionarios()">
          <option value="TODAS">-- Todas as Lojas --</option>
          <option value="1">Loja 1</option>
          <option value="2">Loja 2</option>
          <option value="3">Loja 3</option>
          <option value="4">Loja 4</option>
        </select>
      </div>
      
      <div class="campo-filtro">
        <label for="filtroColaborador">Funcionário:</label>
        <select id="filtroColaborador">
          <option value="TODOS">-- Todos os Funcionários --</option>
        </select>
      </div>
      
      <div class="campo-filtro">
        <label for="filtroMes">Mês de Fechamento:</label>
        <input type="month" id="filtroMes">
      </div>
    </div>

    <div class="botoes-acoes">
      <button class="btn btn-filtrar" onclick="consultarPeriodoBanco()">🔍 Consultar Período</button>
      <button class="btn btn-excel" onclick="exportarParaExcel()">📊 Exportar Excel</button>
      <button class="btn btn-pdf" onclick="exportarParaPDF()">📄 Gerar PDF Resumido</button>
    </div>

    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Funcionário</th>
            <th>Loja/Setor</th>
            <th>Entrada</th>
            <th>S. Almoço</th>
            <th>R. Almoço</th>
            <th>Saída Fim</th>
            <th>Auditoria</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <tr>
            <td colspan="8" style="text-align: center; padding: 40px; color: #666; font-size: 15px;">
              Selecione as opções acima e clique em <b>Consultar Período</b>.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="modalFoto" class="modal">
    <div class="modal-content">

      <img id="modalImg" src="" alt="Foto do Ponto">

      "RONE HORTIFRUTI": { setor: "HORTIFRUTI", loja: "1" },

      "HENRIQUE - DEPOSITO INST MIX": { setor: "ALMOXERIFADO", loja: "1" },
      "VICTOR HUGGO MORAIS DOS SANTOS": { setor: "REPOSITOR", loja: "1" },
      "ERIKA LARISSA DO NASCIMENTO DA SILVA": { setor: "AÇOUGUE", loja: "1" },
      "HILLARIA OLIVEIRA RIBEIRO": { setor: "RH", loja: "1" }
    };

    let registrosProcessadosCache = [];

    // Define data atual
    const dataHoje = new Date();
    document.getElementById('filtroMes').value = dataHoje.getFullYear() + '-' + String(dataHoje.getMonth() + 1).padStart(2, '0');

    function atualizarListaFuncionarios() {
      const lojaSelecionada = document.getElementById('filtroLoja').value;
      const selectColaborador = document.getElementById('filtroColaborador');
      selectColaborador.innerHTML = '<option value="TODOS">-- Todos os Funcionários --</option>';

      Object.keys(dadosColaboradores).sort().forEach(nome => {
        const dados = dadosColaboradores[nome];
        if (lojaSelecionada === "TODAS" || String(dados.loja).trim() === String(lojaSelecionada).trim()) {
          const opt = document.createElement('option');
          opt.value = nome;
          opt.textContent = nome;
          selectColaborador.appendChild(opt);
        }
      });
    }

    function consultarPeriodoBanco() {
      const lojaFiltro = document.getElementById('filtroLoja').value;
      const colabFiltro = document.getElementById('filtroColaborador').value;
      const mesFiltro = document.getElementById('filtroMes').value;

      if (!mesFiltro) { alert("Por favor, selecione o mês!"); return; }

      const partes = mesFiltro.split('-');
      const ano = parseInt(partes[0]);
      const mesZeroBased = parseInt(partes[1]) - 1;
      const totalDiasMes = new Date(ano, mesZeroBased + 1, 0).getDate();

      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px; font-weight:bold; color:#006430;">🔍 Conectando e lendo dados do Firebase...</td></tr>';

      registrosProcessadosCache = [];

      // Acessa o nó 'pontos_registrados' do Realtime Database
      database.ref('pontos_registrados').once('value').then(snapshot => {
        let mapaPontos = {};

        if (snapshot.exists()) {
          snapshot.forEach(child => {
            const ponto = child.val();
            
            // Verifica se a batida pertence ao mês selecionado
            if (ponto.dataChave && ponto.dataChave.startsWith(mesFiltro)) {
              let nomeFunc = ponto.colaborador ? ponto.colaborador.trim().toUpperCase() : "DESCONHECIDO";
              
              // Correção caso ainda existam dados antigos como FLAVIA sem acento
              if (nomeFunc === "FLAVIA DA SILVA MARINHO") { nomeFunc = "FLÁVIO DA SILVA MARINHO"; }

              if (!mapaPontos[nomeFunc]) mapaPontos[nomeFunc] = {};
              if (!mapaPontos[nomeFunc][ponto.dataChave]) mapaPontos[nomeFunc][ponto.dataChave] = [];

              mapaPontos[nomeFunc][ponto.dataChave].push({
                tipo: ponto.tipo,
                horario: ponto.horario,
                fotoSelfie: ponto.fotoSelfie,
                latitude: ponto.latitude,
                longitude: ponto.longitude,
                idBco: child.key
              });
            }
          });
        }

        // Filtra a lista com base nas seleções da tela
        let funcionariosFiltrados = Object.keys(dadosColaboradores).filter(nome => {
          const info = dadosColaboradores[nome];
          if (lojaFiltro !== "TODAS" && String(info.loja).trim() !== String(lojaFiltro).trim()) return false;
          if (colabFiltro !== "TODOS" && nome.toUpperCase() !== colabFiltro.toUpperCase()) return false;
          return true;
        }).sort();

        let htmlTabela = "";

        funcionariosFiltrados.forEach(nome => {
          const cadastro = dadosColaboradores[nome];
          let diasTrabalhados = 0;
          let faltas = 0;

          for (let dia = 1; dia <= totalDiasMes; dia++) {
            const diaFormatado = String(dia).padStart(2, '0');
            const mesFormatado = String(mesZeroBased + 1).padStart(2, '0');
            const dataChaveDia = ano + '-' + mesFormatado + '-' + diaFormatado;
            const dataExibicao = diaFormatado + '/' + mesFormatado + '/' + ano;

            // Busca as batidas ignorando diferenças de maiúsculas/minúsculas no nome
            const registrosDoDia = (mapaPontos[nome.toUpperCase()] && mapaPontos[nome.toUpperCase()][dataChaveDia]) ? mapaPontos[nome.toUpperCase()][dataChaveDia] : [];

            let ent = "--", almSai = "--", almRet = "--", saiFim = "--";
            let auditoria = "--";

            if (registrosDoDia.length > 0) {
              diasTrabalhados++;
              auditoria = '<span class="status-regular">✅ OK</span>';

              registrosDoDia.forEach(reg => {
                let containerAcao = '<div class="bloco-ponto-acoes"><span class="titulo-hora">' + reg.horario + '</span>';
                if (reg.fotoSelfie) {
                  containerAcao += '<button class="btn-foto" onclick="abrirModalFoto(\'' + reg.fotoSelfie + '\')">📸 FOTO</button>';
                }
                if (reg.latitude && reg.longitude) {
                  containerAcao += '<button class="btn-mapa" onclick="abrirMapaGeolocalizacao(' + reg.latitude + ',' + reg.longitude + ')">🗺️ MAPA</button>';
                }
                containerAcao += '</div>';

                if (reg.tipo === "Entrada Expediente" || reg.tipo === "Entrada") ent = containerAcao;
                if (reg.tipo === "Saida Almoço" || reg.tipo === "Saída para Almoço" || reg.tipo === "Intervalo Saída") almSai = containerAcao;
                if (reg.tipo === "Retorno Almoço" || reg.tipo === "Retorno do Almoço" || reg.tipo === "Intervalo Retorno") almRet = containerAcao;
                if (reg.tipo === "Saida Fim" || reg.tipo === "Saída Fim de Expediente" || reg.tipo === "Saída") saiFim = containerAcao;
              });
            } else {
              const hoje = new Date();
              const dataComparacao = new Date(ano, mesZeroBased, dia, 23, 59);
              if (dataComparacao < hoje) {
                ent = '<span class="status-falta">❌ FALTA</span>';
                auditoria = "Falta";
                faltas++;
              }
            }

            htmlTabela += '<tr>' +
              '<td>' + dataExibicao + '</td>' +
              '<td style="font-weight:bold; color:#004a26;">' + nome + '</td>' +
              '<td>' + cadastro.setor + ' (L' + cadastro.loja + ')</td>' +
              '<td>' + ent + '</td>' +
              '<td>' + almSai + '</td>' +
              '<td>' + almRet + '</td>' +
              '<td>' + saiFim + '</td>' +
              '<td>' + auditoria + '</td>' +
              '</tr>';
          }

          registrosProcessadosCache.push({
            nome: nome,
            setor: cadastro.setor,
            loja: cadastro.loja,
            trabalhados: diasTrabalhados,
            faltas: faltas
          });
        });

        corpo.innerHTML = htmlTabela;
      }).catch(erro => {
        // Alerta crucial que avisa na tela se houver bloqueio de regras do Firebase
        alert("⚠️ ERRO DE CONEXÃO COM O FIREBASE:\n" + erro.message + "\n\nVerifique se as Regras de Leitura (.read) do seu banco estão públicas (true).");
        corpo.innerHTML = '<tr><td colspan="8" style="color:red; text-align:center; font-weight:bold;">Falha na conexão externa com o banco de dados.</td></tr>';
      });
    }

    function abrirMapaGeolocalizacao(lat, lng) {
      const urlMaps = "https://www.google.com/maps?q=" + lat + "," + lng;
      window.open(urlMaps, '_blank');
    }

    function abrirModalFoto(urlFoto) {
      document.getElementById('modalImg').src = urlFoto;
      document.getElementById('modalFoto').style.display = 'flex';
    }

    function fecharModalFoto() {
      document.getElementById('modalFoto').style.display = 'none';
    }

    function exportarParaExcel() {
      if (registrosProcessadosCache.length === 0) { alert("Consulte o período antes de baixar o Excel."); return; }
      let dadosFormatadosExcel = registrosProcessadosCache.map(f => ({
        "Colaborador": f.nome,
        "Setor": f.setor,
        "Loja": "Loja " + f.loja,
        "Dias Trabalhados": f.trabalhados,
        "Total de Faltas": f.faltas
      }));
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(dadosFormatadosExcel);
      XLSX.utils.book_append_sheet(wb, ws, "Fechamento Mensal");
      XLSX.writeFile(wb, "Fechamento_Pontos_SR_" + document.getElementById('filtroMes').value + ".xlsx");
    }

    function exportarParaPDF() {
      if (registrosProcessadosCache.length === 0) { alert("Consulte o período antes de gerar o PDF."); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'pt', 'a4');
      doc.setFont("Helvetica", "bold");
      doc.setFontSize(16);
      doc.setTextColor(0, 100, 48);
      doc.text("SUPERMERCADO SÃO RAIMUNDO", 40, 45);
      doc.setFontSize(10);
      doc.setTextColor(110, 110, 110);
      doc.text("RELATÓRIO CONSOLIDADO DE FECHAMENTO MENSAL - COMPETÊNCIA: " + document.getElementById('filtroMes').value, 40, 65);

      let linhasTabelaPDF = registrosProcessadosCache.map(f => [
        f.nome,
        f.setor + " (Loja " + f.loja + ")",
        f.trabalhados,
        f.faltas,
        ""
      ]);

      doc.autoTable({
        head: [['Colaborador', 'Setor / Unidade', 'Dias Trab.', 'Faltas', 'Assinatura do Funcionário']],
        body: linhasTabelaPDF,
        startY: 85,
        theme: 'grid',
        styles: { fontSize: 8, cellPadding: 5 },
        headStyles: { fillColor: [0, 100, 48], textColor: [255, 255, 255], fontStyle: 'bold' },
        columnStyles: { 4: { cellWidth: 150 } }
      });
      doc.save("Resumo_Pontos_SR_" + document.getElementById('filtroMes').value + ".pdf");
    }

    atualizarListaFuncionarios();
  </script>
</body>
</html>
