    h1 { color: #006430; margin-top: 0; border-bottom: 3px solid #ffd700; padding-bottom: 12px; font-size: 26px; font-weight: 700; }
    
    .filtros-topo { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; background: #f9fdfa; padding: 20px; border-radius: 8px; border: 1px solid #c8e6c9; }
    .campo-filtro { flex: 1; min-width: 220px; }
    .campo-filtro label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 6px; color: #004a26; text-transform: uppercase; }
    .campo-filtro select, .campo-filtro input { width: 100%; padding: 10px; border: 1px solid #a5d6a7; border-radius: 6px; font-size: 14px; box-sizing: border-box; background-color: white; }
    
    .botoes-acoes { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; }
    .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    
    .btn-filtrar { background-color: #006430; }
    .btn-filtrar:hover { background-color: #004a26; }
    .btn-excel { background-color: #2e7d32; }
    .btn-excel:hover { background-color: #1b5e20; }
    .btn-pdf { background-color: #0b5394; }
    .btn-pdf:hover { background-color: #073763; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: left; }
    th { background-color: #006430; color: white; padding: 14px 10px; font-size: 13px; border-bottom: 3px solid #ffd700; text-transform: uppercase; }
    td { padding: 12px 10px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    tr:hover { background-color: #f1f8f3; }
    
    .status-falta { color: #c62828; font-weight: bold; background: #ffebee; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    .status-regular { color: #2e7d32; font-weight: bold; }
    
    .bloco-ponto-acoes { display: inline-flex; flex-direction: column; align-items: center; background: #eef4f0; padding: 6px; border-radius: 6px; border: 1px solid #d0dfd5; min-width: 80px; }
    .titulo-hora { font-size: 11px; font-weight: bold; color: #004a26; margin-bottom: 4px; }
    .btn-foto { background: #673ab7; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 2px; }
    .btn-mapa { background: #0b5394; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; width: 100%; text-decoration: none; text-align: center; box-sizing: border-box; display: block; }

    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
    .modal-content { background-color: white; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; }

    function atualizarListaFuncionarios() {
      const lojaSelecionada = document.getElementById('filtroLoja').value;
      const selectColaborador = document.getElementById('filtroColaborador');
      selectColaborador.innerHTML = '<option value="TODOS">-- Todos os Funcionários --</option>';

      Object.keys(dadosColaboradores).sort().forEach(nome => {

          opt.value = nome;
          opt.textContent = nome;
          selectColaborador.appendChild(opt);

    // Normaliza os textos da mesma forma que o aplicativo antigo faz
    function normalizarTexto(texto) {
      if (!texto) return "";
      let t = texto.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      if (t.includes("francisca souza") || t.includes("franc.acou")) return "franciscasouza";
      if (t.includes("roni") || t.includes("rone")) return "ronefruta";
      return t.replace(/\s+/g, "");
    }

    function consultarPeriodoBanco() {
      const lojaFiltro = document.getElementById('filtroLoja').value;
      const colabFiltro = document.getElementById('filtroColaborador').value;
      const mesFiltro = document.getElementById('filtroMes').value;

      if (!mesFiltro) { alert("Por favor, selecione o mês!"); return; }

      const partes = mesFiltro.split('-');
      const ano = parseInt(partes[0]);
      const mesZeroBased = parseInt(partes[1]) - 1;
      const totalDiasMes = new Date(ano, mesZeroBased + 1, 0).getDate();

      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px; font-weight:bold; color:#006430;">🔍 Baixando registros ativos do Firebase...</td></tr>';

      registrosProcessadosCache = [];

      database.ref('pontos_registrados').once('value').then(snapshot => {
        let mapaPontos = {};

        if (snapshot.exists()) {
          snapshot.forEach(child => {
            const p = child.val();
            if (p.colaborador && p.horario && p.tipo) {
              let dataChaveLimpa = "";
              
              if (p.dataChave) {
                if (p.dataChave.includes('/')) {
                  let pt = p.dataChave.split('/');
                  dataChaveLimpa = `${pt[2]}-${pt[1]}-${pt[0]}`;
                } else {
                  dataChaveLimpa = p.dataChave;
                }
              } else if (p.data) {
                let pt = p.data.split('/');
                dataChaveLimpa = `${pt[2]}-${pt[1]}-${pt[0]}`;
              }

              if (dataChaveLimpa.startsWith(mesFiltro)) {
                let nFunc = normalizarTexto(p.colaborador);
                let chaveAgrupada = `${dataChaveLimpa}_${nFunc}`;
                
                if (!mapaPontos[chaveAgrupada]) {
                  mapaPontos[chaveAgrupada] = [];
                }

                mapaPontos[chaveAgrupada].push({
                  tipo: normalizarTexto(p.tipo),
                  horario: p.horario,
                  fotoSelfie: p.fotoSelfie || null,
                  latitude: p.latitude || null,
                  longitude: p.longitude || null
                });
              }
            }
          });
        }

        // Filtra a lista com base na seleção da tela
        let funcionariosFiltrados = Object.keys(dadosColaboradores).filter(nome => {
          const info = dadosColaboradores[nome];
          if (lojaFiltro !== "TODAS" && String(info.loja).trim() !== String(lojaFiltro).trim()) return false;
          if (colabFiltro !== "TODOS" && nome !== colabFiltro) return false;
          return true;
        }).sort();

        let htmlTabela = "";

        funcionariosFiltrados.forEach(nome => {
          const cadastro = dadosColaboradores[nome];
          const chaveAppNome = cadastro.chaveApp || normalizarTexto(nome);
          let diasTrabalhados = 0;
          let faltas = 0;

          for (let dia = 1; dia <= totalDiasMes; dia++) {
            const diaFormatado = String(dia).padStart(2, '0');
            const mesFormatado = String(mesZeroBased + 1).padStart(2, '0');
            const dataChaveDia = ano + '-' + mesFormatado + '-' + diaFormatado;
            const dataExibicao = diaFormatado + '/' + mesFormatado + '/' + ano;

            const chaveAgrupadaBusca = `${dataChaveDia}_${chaveAppNome}`;
            const registrosDoDia = mapaPontos[chaveAgrupadaBusca] || [];

            let ent = "--", almSai = "--", almRet = "--", saiFim = "--";
            let auditoria = "--";

            if (registrosDoDia.length > 0) {
              diasTrabalhados++;
              auditoria = '<span class="status-regular">✅ OK</span>';

              registrosDoDia.forEach(reg => {
                let containerAcao = '<div class="bloco-ponto-acoes"><span class="titulo-hora">' + reg.horario + '</span>';
                if (reg.fotoSelfie) {
                  containerAcao += '<button class="btn-foto" onclick="abrirModalFoto(\'' + reg.fotoSelfie + '\')">📸 FOTO</button>';
                }
                if (reg.latitude && reg.longitude) {
                  containerAcao += '<button class="btn-mapa" onclick="abrirMapaGeolocalizacao(' + reg.latitude + ',' + reg.longitude + ')">🗺️ MAPA</button>';
                }
                containerAcao += '</div>';

                if (reg.tipo.includes("entrada") && !reg.tipo.includes("alm")) ent = containerAcao;
                if (reg.tipo.includes("saidaalm") || reg.tipo === "almoco" || (reg.tipo.includes("saida") && reg.tipo.includes("alm"))) almSai = containerAcao;
                if (reg.tipo.includes("retorno") || reg.tipo.includes("retalm") || (reg.tipo.includes("volta") && reg.tipo.includes("alm"))) almRet = containerAcao;
                if (reg.tipo.includes("expediente") || reg.tipo.includes("fim") || reg.tipo.includes("saidafim") || (reg.tipo.includes("saida") && !reg.tipo.includes("alm"))) saiFim = containerAcao;
              });
            } else {
              const hoje = new Date();
              const dataComparacao = new Date(ano, mesZeroBased, dia, 23, 59);
              if (dataComparacao < hoje) {
                ent = '<span class="status-falta">❌ FALTA</span>';
                auditoria = "Ausência";
                faltas++;
              }
            }

            htmlTabela += '<tr>' +
              '<td>' + dataExibicao + '</td>' +
              '<td style="font-weight:bold; color:#004a26;">' + nome + '</td>' +
              '<td>' + cadastro.setor + ' (L' + cadastro.loja + ')</td>' +
              '<td>' + ent + '</td>' +
              '<td>' + almSai + '</td>' +
              '<td>' + almRet + '</td>' +
              '<td>' + saiFim + '</td>' +
              '<td>' + auditoria + '</td>' +
              '</tr>';
          }

          registrosProcessadosCache.push({
            nome: nome,
            setor: cadastro.setor,
            loja: cadastro.loja,
            trabalhados: diasTrabalhados,
            faltas: faltas
          });
        });

        corpo.innerHTML = htmlTabela;
      }).catch(erro => {
        alert("Erro na leitura do Firebase: " + erro.message);
        corpo.innerHTML = '<tr><td colspan="8" style="color:red; text-align:center;">Falha de comunicação.</td></tr>';
      });
    }

    function abrirMapaGeolocalizacao(lat, lng) {
      window.open('https://maps.google.com/?q=' + lat + ',' + lng, '_blank');
    }

    function abrirModalFoto(urlFoto) {
      document.getElementById('modalImg').src = urlFoto;
      document.getElementById('modalFoto').style.display = 'flex';
    }

    function fecharModalFoto() {
      document.getElementById('modalFoto').style.display = 'none';
    }

    function exportarParaExcel() {
      if (registrosProcessadosCache.length === 0) { alert("Consulte o período antes."); return; }
      let dadosFormatadosExcel = registrosProcessadosCache.map(f => ({
        "Colaborador": f.nome,
        "Setor": f.setor,
        "Loja": "Loja " + f.loja,
        "Dias Trabalhados": f.trabalhados,
        "Total de Faltas": f.faltas
      }));
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(dadosFormatadosExcel);
      XLSX.utils.book_append_sheet(wb, ws, "Fechamento");
      XLSX.writeFile(wb, "Pontos_SR_" + document.getElementById('filtroMes').value + ".xlsx");
    }

    function exportarParaPDF() {
      if (registrosProcessadosCache.length === 0) { alert("Consulte o período antes."); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'pt', 'a4');
      doc.setFont("Helvetica", "bold");
      doc.setFontSize(14);
      doc.setTextColor(0, 100, 48);
      doc.text("SUPERMERCADO SÃO RAIMUNDO", 40, 45);

      let linhasTabelaPDF = registrosProcessadosCache.map(f => [
        f.nome,
        f.setor + " (Loja " + f.loja + ")",
        f.trabalhados,
        f.faltas,
        ""
      ]);

      doc.autoTable({
        head: [['Colaborador', 'Setor', 'Dias Trab.', 'Faltas', 'Assinatura']],
        body: linhasTabelaPDF,
        startY: 70,
        theme: 'grid',
        styles: { fontSize: 8 },
        headStyles: { fillColor: [0, 100, 48] }
      });
      doc.save("Pontos_SR_" + document.getElementById('filtroMes').value + ".pdf");
    }

    atualizarListaFuncionarios();
  </script>
</body>
</html>
