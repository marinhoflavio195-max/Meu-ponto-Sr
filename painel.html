<!DOCTYPE html>
<html lang="pt-br">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .painel-container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { color: #d32f2f; margin-top: 0; border-bottom: 3px solid #d32f2f; padding-bottom: 10px; font-size: 26px; }
    .filtros-topo { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; background: #fdf2f2; padding: 15px; border-radius: 8px; border: 1px solid #ffcdd2; }
    .campo-filtro { flex: 1; min-width: 200px; }
    .campo-filtro label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #555; }
    .campo-filtro select, .campo-filtro input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
    .botoes-acoes { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn { padding: 12px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; transition: background 0.2s; }
    .btn-filtrar { background-color: #d32f2f; }
    .btn-excel { background-color: #2e7d32; }
    .btn-pdf { background-color: #1565c0; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th { background-color: #d32f2f; color: white; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #e0e0e0; }
    tr:hover { background-color: #f9f9f9; }
    .status-falta { color: #c62828; font-weight: bold; background: #ffebee; padding: 3px 6px; border-radius: 4px; }
    .status-folga { color: #2e7d32; font-weight: bold; background: #e8f5e9; padding: 3px 6px; border-radius: 4px; }
    .status-atraso { color: #e65100; font-weight: bold; }
  </style>
</head>
<body>

          <option value="Henrique">Henrique</option>

          <option value="Flávia">Flávia</option>
          <option value="keverson">Keverson</option>
          <option value="Marcelo">Marcelo</option>
          <option value="Alan">Alan</option>
          <option value="Vilson">Vilson</option>
          <option value="Carlos">Carlos</option>

          <option value="Alice">Alice</option>

    <div class="botoes-acoes">
      <button class="btn btn-filtrar" onclick="processarFechamentoMensal()">🔍 Consultar Período</button>
      <button class="btn btn-excel" onclick="baixarExcel()">📊 Baixar Excel</button>
      <button class="btn btn-pdf" onclick="baixarPDF()">📄 Gerar PDF</button>
    </div>

    <div style="overflow-x:auto;">
      <table id="tabelaFechamento">
        <thead>
          <tr>
            <th>Data</th>
            <th>Funcionário</th>
            <th>Entrada</th>
            <th>S. Almoço</th>
            <th>R. Almoço</th>
            <th>Saída Fim</th>
            <th>Atraso (Minutos)</th>
            <th>Status do Dia</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <tr><td colspan="8" style="text-align:center; padding:20px;">Selecione os parâmetros e clique em Consultar.</td></tr>
        </tbody>
      </table>
    </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJMoG89lg9TXxO9z1d8jxbAzGms9Ts1sc",
      authDomain: "meu-ponto-sr.firebaseapp.com",
      databaseURL: "https://meu-ponto-sr-default-rtdb.firebaseio.com",
      projectId: "meu-ponto-sr",
      storageBucket: "meu-ponto-sr.appspot.com",
      messagingSenderId: "356930006135",
      appId: "1:356930006135:web:90bc643a9cd39a38f02a72"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    document.getElementById('filtroMes').value = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');

    let relatorioFinal = [];

    function processarFechamentoMensal() {
      const func = document.getElementById('filtroColaborador').value;
      const mesRef = document.getElementById('filtroMes').value; // "YYYY-MM"
      const corpo = document.getElementById('corpoTabela');
      corpo.innerHTML = "<tr><td colspan='8' style='text-align:center;'>Processando auditoria...</td></tr>";

      let ano = parseInt(mesRef.split('-')[0]);
      let mes = parseInt(mesRef.split('-')[1]) - 1;
      let totalDias = new Date(ano, mes + 1, 0).getDate();

      database.ref('pontos_registrados').once('value', snapshot => {
        let batidasDoBanco = {};
        
        snapshot.forEach(child => {
          let p = child.val();
          if (p.colaborador === func && p.dataChave && p.dataChave.startsWith(mesRef)) {
            if (!batidasDoBanco[p.dataChave]) {
              batidasDoBanco[p.dataChave] = { entrada: "--", saidaAlm: "--", retAlm: "--", saidaFim: "--", atraso: 0 };
            }
            if (p.tipo === "Entrada Manhã") { batidasDoBanco[p.dataChave].entrada = p.horario; batidasDoBanco[p.dataChave].atraso = p.atrasoMinutos || 0; }
            if (p.tipo === "Saída Almoço") batidasDoBanco[p.dataChave].saidaAlm = p.horario;
            if (p.tipo === "Retorno Almoço") batidasDoBanco[p.dataChave].retAlm = p.horario;
            if (p.tipo === "Saída Expediente") batidasDoBanco[p.dataChave].saidaFim = p.horario;
          }
        });

        relatorioFinal = [];
        corpo.innerHTML = "";

        // Loop por todos os dias reais do mês para encontrar Faltas Automáticas e Domingos (Folgas)
        for (let d = 1; d <= totalDias; d++) {
          let dataCorrente = new Date(ano, mes, d);
          let diaStr = String(d).padStart(2, '0');
          let mesStr = String(mes + 1).padStart(2, '0');
          let chaveData = `${ano}-${mesStr}-${diaStr}`;
          let dataFormatadaExibir = `${diaStr}/${mesStr}/${ano}`;

          let diaSemana = dataCorrente.getDay(); // 0 = Domingo
          let statusDia = "Regular";
          let classStatus = "";
          
          let diaBtd = batidasDoBanco[chaveData] || { entrada: "--", saidaAlm: "--", retAlm: "--", saidaFim: "--", atraso: 0 };

          if (diaBtd.entrada === "--" && diaBtd.saidaFim === "--") {
            if (diaSemana === 0) {
              statusDia = "FOLGA DOMINGO";
              classStatus = "status-folga";
            } else {
              statusDia = "FALTA";
              classStatus = "status-falta";
            }
          }

          relatorioFinal.push({
            data: dataFormatadaExibir, func,
            entrada: diaBtd.entrada, saidaAlm: diaBtd.saidaAlm, retAlm: diaBtd.retAlm, saidaFim: diaBtd.saidaFim,
            atraso: diaBtd.atraso, statusDia, classStatus
          });
        }

        relatorioFinal.forEach(r => {
          let tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${r.data}</strong></td>
            <td>${r.func}</td>
            <td>${r.entrada}</td>
            <td>${r.saidaAlm}</td>
            <td>${r.retAlm}</td>
            <td>${r.saidaFim}</td>
            <td class="status-atraso">${r.atraso > 0 ? r.atraso + ' min' : '0'}</td>
            <td><span class="${r.classStatus}">${r.statusDia}</span></td>
          `;
          corpo.appendChild(tr);
        });
      });
    }

    function baixarExcel() {
      let dados = [["Data", "Funcionário", "Entrada", "Saída Almoço", "Retorno Almoço", "Saída Termo", "Minutos Atraso", "Status do Dia"]];
      relatorioFinal.forEach(r => dados.push([r.data, r.func, r.entrada, r.saidaAlm, r.retAlm, r.saidaFim, r.atraso, r.statusDia]));
      let sheet = XLSX.utils.aoa_to_sheet(dados);
      let book = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(book, sheet, "Auditoria");
      XLSX.writeFile(book, `Fechamento_SR_${document.getElementById('filtroMes').value}.xlsx`);
    }

    function baixarPDF() {
      const { jsPDF } = window.jspdf;
      let doc = new jsPDF();
      doc.setFontSize(16); doc.text("SÃO RAIMUNDO SUPERMERCADO - CONTROLE DE PONTO", 14, 15);
      doc.setFontSize(11); doc.text(`Fechamento Mensal - Ref: ${document.getElementById('filtroMes').value}`, 14, 22);
      
      let col = ["Data", "Funcionário", "Entrada", "S. Almoço", "R. Almoço", "Saída", "Atraso", "Status"];
      let rows = [];
      relatorioFinal.forEach(r => rows.push([r.data, r.func, r.entrada, r.saidaAlm, r.retAlm, r.saidaFim, r.atraso + " min", r.statusDia]));
      
      doc.autoTable({ startY: 28, head: [col], body: rows, theme: 'grid' });
      doc.save(`Fechamento_SR_${document.getElementById('filtroMes').value}.pdf`);
    }
  </script>
