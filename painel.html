    .botoes-acoes { display: flex; gap: 15px; margin-bottom: 25px; }
    .btn { padding: 14px 25px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; transition: background 0.2s; }
    .btn-filtrar { background-color: #006430; border-bottom: 3px solid #004a26; }
    .btn-filtrar:hover { background-color: #004a26; }
    .btn-excel { background-color: #2e7d32; border-bottom: 3px solid #1b5e20; }
    .btn-excel:hover { background-color: #1b5e20; }
    .btn-pdf { background-color: #0b5394; border-bottom: 3px solid #073763; }
    .btn-pdf:hover { background-color: #073763; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th { background-color: #006430; color: white; padding: 12px 8px; text-align: left; font-size: 14px; border-bottom: 3px solid #ffd700; }
    td { padding: 12px 8px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    tr:hover { background-color: #f1f8f3; }
    
    .status-falta { color: #c62828; font-weight: bold; background: #ffebee; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
    .status-folga { color: #006430; font-weight: bold; background: #e8f5e9; padding: 5px 10px; border-radius: 4px; font-size: 12px; border: 1px solid #a5d6a7; }
    .escala-info { font-size: 11px; color: #555; display: block; font-weight: normal; }
    
    .col-atraso { color: #c62828; font-weight: bold; background-color: #fff5f5; }
    .col-extra { color: #006430; font-weight: bold; background-color: #f0f7f1; }
    .col-incompleto { color: #757575; font-style: italic; }
    
    .bloco-ponto-acoes { display: inline-flex; flex-direction: column; align-items: center; background: #eef4f0; padding: 5px; border-radius: 6px; margin-right: 4px; margin-bottom: 4px; min-width: 80px; border: 1px solid #d0dfd5; }
    .titulo-acao-btd { font-size: 10px; font-weight: bold; color: #004a26; margin-bottom: 3px; text-transform: uppercase; }
    .btn-foto { background: #673ab7; color: white; border: none; padding: 4px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 2px; }
    .btn-mapa { background: #0b5394; color: white; border: none; padding: 4px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; width: 100%; text-decoration: none; text-align: center; box-sizing: border-box; display: block; }

      "Jaki": [3], "Alice": [3], "Thalice": [3], "Raimundo Q": [3], "Andre": [3], "Rone Fruta": [3], "Raylma": [3], "Franc Acou": [3], "Samira": [3], "Henrrique": [3], "Edmilson": [3], "Flavia": [3], "Keverson": [3],
      "Rita": [4], "Sueli": [4], "Edete": [4], "Genilson": [4], "Erisvana": [4], "Leandro": [4], "Victor": [4], "Hilaria": [4], "Talison": [4], "Alan": [4],
      "Patricia": [5], "Carlos": [5], "Vinicios": [5], "Valdimiro": [5], "Karine": [5], "Jeferson": [5], "Dulce": [5], "Eudes": [5], "Felipe Frente": [5], "Denilson": [5], "Henrique": [5]

    const hojeObj = new Date();
    document.getElementById('filtroMes').value = hojeObj.getFullYear() + '-' + String(hojeObj.getMonth() + 1).padStart(2, '0');
    document.getElementById('filtroDataFolga').value = hojeObj.toISOString().split('T')[0];

    function obterNumeroSemanaAno(data) {
      const d = new Date(Date.UTC(data.getFullYear(), data.getMonth(), data.getDate()));
      const diaNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - diaNum);
      const anoInicio = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - anoInicio) / 86400000) + 1) / 7);
    }

    // AJUSTADO: CORREÇÃO TOTAL DA LÓGICA DE FOLGAS DIÁRIAS NO CARD DO TOPO
    window.atualizarPainelFolgasDiario = function() {
      const dataSelecionadaStr = document.getElementById('filtroDataFolga').value;
      if (!dataSelecionadaStr) return;

      const partes = dataSelecionadaStr.split('-');
      const dataFocada = new Date(partes[0], partes[1] - 1, partes[2]);
      const diaSemana = dataFocada.getDay();
      const numSemanaAno = obterNumeroSemanaAno(dataFocada);

      let dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
      document.getElementById('tituloFolgasDoDia').innerHTML = `⚽ COLABORADORES DE FOLGA NO DIA (${dataFormatada}):`;

      let folguistas = [];

      Object.keys(mapeamentoEquipes).forEach(f => {
        let eq = mapeamentoEquipes[f];
        
        if (eq === "DEPOSITO") {
          if (diaSemana === 0) folguistas.push(`${f} (Depósito)`);
        } 
        else {
          // Identifica o turno exato da equipe do colaborador na semana em análise
          let turnoDaSemana = "";
          if (numSemanaAno % 2 === 0) {
            turnoDaSemana = (eq === "EQUIP_1") ? "07:00" : "10:00";
          } else {
            turnoDaSemana = (eq === "EQUIP_1") ? "10:00" : "07:00";
          }

          // REGRA CORRIGIDA: Se é semana de 10:00 (Noite), folga obrigatoriamente no Domingo e tem as folgas picadas
          if (turnoDaSemana === "10:00") {
            if (diaSemana === 0) {
              folguistas.push(`${f} (Domingo - Equipe da Noite)`);
            } else if (escalaFolgasSemanais[f] && escalaFolgasSemanais[f].includes(diaSemana)) {
              folguistas.push(f);
            }
          } 
          // REGRA CORRIGIDA: Se é semana de 07:00 (Manhã), trabalha domingo e NÃO tem folga picada útil!
          else if (turnoDaSemana === "07:00") {
            // Não faz nada de segunda a sábado (não entra na lista de folgas)
            // Domingo trabalha, então também não entra aqui.
          }
        }
      });

      const container = document.getElementById('listaFolguistasContainer');
      if (folguistas.length === 0) {
        container.innerHTML = "Nenhum funcionário escalado para folga nesta data (Todos em campo!).";
      } else {
        container.innerHTML = folguistas.join(' • ');
      }
    }

    setTimeout(() => { window.atualizarPainelFolgasDiario(); }, 800);

    function converterParaMinutos(horarioStr) {
      if (!horarioStr || horarioStr === "--") return null;
      let partes = horarioStr.split(':');
      return (parseInt(partes[0]) * 60) + parseInt(partes[1]);
    }

    function formatarMinutosLegivel(minutosTotais) {
      if (minutosTotais <= 0) return "0";
      let horas = Math.floor(minutosTotais / 60);
      let mins = minutosTotais % 60;
      if (horas > 0) return `${horas}h ${mins}min`;
      return `${mins} min`;
    }

    function processarFechamentoMensal() {
      const funcSelecionado = document.getElementById('filtroColaborador').value;
      const mesRef = document.getElementById('filtroMes').value; 
      const corpo = document.getElementById('corpoTabela');
      corpo.innerHTML = "<tr><td colspan='9' style='text-align:center; padding:25px;'>Carregando registros e aplicando regras de rodízio de equipes...</td></tr>";

      let ano = parseInt(mesRef.split('-')[0]);
      let mes = parseInt(mesRef.split('-')[1]) - 1;
      let totalDias = new Date(ano, mes + 1, 0).getDate();

      let listaParaProcessar = funcSelecionado === "TODOS" ? Object.keys(mapeamentoEquipes) : [funcSelecionado];

      database.ref('pontos_registrados').once('value', snapshot => {
        let batidasDoBanco = {};
        mapaFotosMemoria = {};
        
        snapshot.forEach(child => {
          let p = child.val();
          if (p.dataChave && p.dataChave.startsWith(mesRef)) {
            let chaveAgrupada = `${p.dataChave}_${p.colaborador}`;
            if (!batidasDoBanco[chaveAgrupada]) {
              batidasDoBanco[chaveAgrupada] = { entrada: "--", saidaAlm: "--", retAlm: "--", saidaFim: "--" };
            }
            let idFoto = `${child.key}`;
            if(p.fotoSelfie) mapaFotosMemoria[idFoto] = p.fotoSelfie;
            let gpsLink = (p.latitude && p.longitude) ? `https://maps.google.com/?q=${p.latitude},${p.longitude}` : null;

            if (p.tipo === "Entrada Manhã") { batidasDoBanco[chaveAgrupada].entrada = p.horario; if(p.fotoSelfie) batidasDoBanco[chaveAgrupada].idFotoEntrada = idFoto; batidasDoBanco[chaveAgrupada].gpsEntrada = gpsLink; }
            if (p.tipo === "Saída Almoço") { batidasDoBanco[chaveAgrupada].saidaAlm = p.horario; if(p.fotoSelfie) batidasDoBanco[chaveAgrupada].idFotoSaidaAlm = idFoto; batidasDoBanco[chaveAgrupada].gpsSaidaAlm = gpsLink; }
            if (p.tipo === "Retorno Almoço") { batidasDoBanco[child.key]); batidasDoBanco[chaveAgrupada].retAlm = p.horario; if(p.fotoSelfie) batidasDoBanco[chaveAgrupada].idFotoRetAlm = idFoto; batidasDoBanco[chaveAgrupada].gpsRetAlm = gpsLink; }
            if (p.tipo === "Saída Expediente") { batidasDoBanco[chaveAgrupada].saidaFim = p.horario; if(p.fotoSelfie) batidasDoBanco[chaveAgrupada].idFotoSaidaFim = idFoto; batidasDoBanco[chaveAgrupada].gpsSaidaFim = gpsLink; }
          }
        });

        relatorioFinal = [];
        corpo.innerHTML = "";

        for (let d = 1; d <= totalDias; d++) {
          let dataCorrente = new Date(ano, mes, d);
          let diaStr = String(d).padStart(2, '0');
          let mesStr = String(mes + 1).padStart(2, '0');
          let chaveData = `${ano}-${mesStr}-${diaStr}`;
          let dataFormatadaExibir = `${diaStr}/${mesStr}/${ano}`;
          let diaSemana = dataCorrente.getDay(); 
          let numSemanaAno = obterNumeroSemanaAno(dataCorrente);

          listaParaProcessar.forEach(f => {
            let chaveBusca = `${chaveData}_${f}`;
            let eq = mapeamentoEquipes[f] || "EQUIP_1";
            
            let turnoEsperado = ""; 
            let statusDia = "Regular";
            let classStatus = "";
            let totalAtrasoExibir = "0";
            let totalExtraExibir = "0";
            let jornadaAlvoMinutos = 480;

            if (eq === "DEPOSITO") {
              if (diaSemana === 0) {
                statusDia = "FOLGA DOMINGO";
                classStatus = "status-folga";
              } else if (diaSemana === 6) {
                turnoEsperado = "07:00 às 13:00 (Sábado)";
                jornadaAlvoMinutos = 360;
              } else {
                turnoEsperado = "07:00 às 17:30 (Semana)";
                jornadaAlvoMinutos = 510;
              }
            } 
            else {
              let baseTurno = "";
              if (numSemanaAno % 2 === 0) {
                baseTurno = (eq === "EQUIP_1") ? "07:00" : "10:00";
              } else {
                baseTurno = (eq === "EQUIP_1") ? "10:00" : "07:00";
              }

              // AJUSTADO: INVERSÃO DA REGRA PARA A TABELA DE FECHAMENTO MENSAL
              if (baseTurno === "10:00") {
                turnoEsperado = "10:00 às 20:00";
                if (diaSemana === 0) {
                  statusDia = "FOLGA DOMINGO";
                  classStatus = "status-folga";
                } else if (escalaFolgasSemanais[f] && escalaFolgasSemanais[f].includes(diaSemana)) {
                  statusDia = "FOLGA SEMANAL";
                  classStatus = "status-folga";
                }
              } else {
                turnoEsperado = "07:00 às 17:00";
                if (diaSemana === 0) {
                  turnoEsperado = "07:00 às 12:00 (Fim de Semana)";
                  jornadaAlvoMinutos = 300; // Turno corrido de domingo
                }
                // Na semana de 7:00, de segunda a sábado é dia "Regular" normal (sem folgas picadas)
              }
            }

            let diaBtd = batidasDoBanco[chaveBusca] || { entrada: "--", saidaAlm: "--", retAlm: "--", saidaFim: "--" };

            if (statusDia === "Regular") {
              let temAlgumaBatida = (diaBtd.entrada !== "--" || diaBtd.saidaAlm !== "--" || diaBtd.retAlm !== "--" || diaBtd.saidaFim !== "--");
              
              if (temAlgumaBatida) {
                let ehTurnoDireto = (diaSemana === 0 && eq !== "DEPOSITO") || (diaSemana === 6 && eq === "DEPOSITO");

                if (ehTurnoDireto) {
                  if (diaBtd.entrada !== "--" && diaBtd.saidaFim !== "--") {
                    let totalTrabalhadoNoDia = converterParaMinutos(diaBtd.saidaFim) - converterParaMinutos(diaBtd.entrada);
                    if (totalTrabalhadoNoDia < jornadaAlvoMinutos) totalAtrasoExibir = formatarMinutosLegivel(jornadaAlvoMinutos - totalTrabalhadoNoDia);
                    else if (totalTrabalhadoNoDia > jornadaAlvoMinutos) totalExtraExibir = formatarMinutosLegivel(totalTrabalhadoNoDia - jornadaAlvoMinutos);
                  } else {
                    totalAtrasoExibir = "<span class='col-incompleto'>Incompleto</span>";
                    totalExtraExibir = "<span class='col-incompleto'>Incompleto</span>";
                  }
                } else {
                  if (diaBtd.entrada !== "--" && diaBtd.saidaAlm !== "--" && diaBtd.retAlm !== "--" && diaBtd.saidaFim !== "--") {
                    let minutosTrabalhadosManha = converterParaMinutos(diaBtd.saidaAlm) - converterParaMinutos(diaBtd.entrada);
                    let minutosTrabalhadosTarde = converterParaMinutos(diaBtd.saidaFim) - converterParaMinutos(diaBtd.retAlm);
                    let totalTrabalhadoNoDia = minutosTrabalhadosManha + minutosTrabalhadosTarde;

                    if (totalTrabalhadoNoDia < jornadaAlvoMinutos) totalAtrasoExibir = formatarMinutosLegivel(jornadaAlvoMinutos - totalTrabalhadoNoDia);
                    else if (totalTrabalhadoNoDia > jornadaAlvoMinutos) totalExtraExibir = formatarMinutosLegivel(totalTrabalhadoNoDia - jornadaAlvoMinutos);
                  } else {
                    totalAtrasoExibir = "<span class='col-incompleto'>Incompleto</span>";
                    totalExtraExibir = "<span class='col-incompleto'>Incompleto</span>";
                  }
                }
              } else {
                statusDia = "FALTA";
                classStatus = "status-falta";
                totalAtrasoExibir = formatarMinutosLegivel(jornadaAlvoMinutos);
              }
            }

            relatorioFinal.push({
              data: dataFormatadaExibir, func: f, turnoEsperado,
              entrada: diaBtd.entrada, saidaAlm: diaBtd.saidaAlm, retAlm: diaBtd.retAlm, saidaFim: diaBtd.saidaFim,
              atraso: totalAtrasoExibir, extra: totalExtraExibir, statusDia, classStatus, chaveData,
              imgE: diaBtd.idFotoEntrada, imgSA: diaBtd.idFotoSaidaAlm, imgRA: diaBtd.idFotoRetAlm, imgSF: diaBtd.idFotoSaidaFim,
              mapE: diaBtd.gpsEntrada, mapSA: diaBtd.gpsSaidaAlm, mapRA: diaBtd.gpsRetAlm, mapSF: diaBtd.gpsSaidaFim
            });
          });
        }

        relatorioFinal.sort((a, b) => a.chaveData.localeCompare(b.chaveData));

        relatorioFinal.forEach(r => {
          let tr = document.createElement('tr');
          
          let containerAuditoria = "";
          if (r.classStatus !== "" && r.statusDia !== "FALTA") {
            containerAuditoria = `<span class="${r.classStatus}">${r.statusDia}</span>`;
          } else if (r.statusDia === "FALTA") {
            containerAuditoria = `<span class="${r.classStatus}">${r.statusDia}</span>`;
          } else {
            function criarMiniBloco(label, img, map) {
              if(!img && !map) return '<span class="sem-foto">-</span>';
              let b = `<div class="bloco-ponto-acoes"><span class="titulo-acao-btd">${label}</span>`;
              if(img) b += `<button class="btn-foto" onclick="abrirModal('${img}', '${r.func} - ${label}')">📸 Foto</button>`;
              if(map) b += `<a href="${map}" target="_blank" class="btn-mapa">📍 Mapa</a>`;
              b += `</div>`;
              return b;
            }
            
            let ehTurnoDireto = r.turnoEsperado.includes("Sábado") || r.turnoEsperado.includes("Fim de Semana");
            
            containerAuditoria += criarMiniBloco("Ent", r.imgE, r.mapE);
            containerAuditoria += ehTurnoDireto ? "" : criarMiniBloco("Alm", r.imgSA, r.mapSA);
            containerAuditoria += ehTurnoDireto ? "" : criarMiniBloco("Ret", r.imgRA, r.mapRA);
            containerAuditoria += criarMiniBloco("Sai", r.imgSF, r.mapSF);
          }

          let tdAtrasoClass = (r.atraso !== "0" && r.atraso !== "<span class='col-incompleto'>Incompleto</span>") ? "class='col-atraso'" : "";
          let tdExtraClass = (r.extra !== "0" && r.extra !== "<span class='col-incompleto'>Incompleto</span>") ? "class='col-extra'" : "";

          tr.innerHTML = `
            <td><strong>${r.data}</strong><span class="escala-info">${r.turnoEsperado}</span></td>
            <td><strong>${r.func}</strong></td>
            <td>${r.entrada}</td>
            <td>${r.saidaAlm}</td>
            <td>${r.retAlm}</td>
            <td>${r.saidaFim}</td>
            <td ${tdAtrasoClass}>${r.atraso}</td>
            <td ${tdExtraClass}>${r.extra}</td>
            <td>${containerAuditoria}</td>
          `;
          corpo.appendChild(tr);
        });
      });
    }

    function abrirModal(idFoto, titulo) {
      if(mapaFotosMemoria[idFoto]) {
        document.getElementById("modalTitulo").innerHTML = titulo;
        document.getElementById("modalImg").src = mapaFotosMemoria[idFoto];
        document.getElementById("modalFoto").style.display = "flex";
      } else {
        alert("Foto indisponível.");
      }
    }

    function fecharModal() { document.getElementById("modalFoto").style.display = "none"; }

    function baixarExcel() {
      let dados = [["Data", "Funcionário", "Escala Prevista", "Entrada", "Saída Almoço", "Retorno Almoço", "Saída Fim", "Atraso / Débito", "Hora Extra", "Status"]];
      relatorioFinal.forEach(r => {
        let atrClean = r.atraso.includes("Incompleto") ? "Incompleto" : r.atraso;
        let extClean = r.extra.includes("Incompleto") ? "Incompleto" : r.extra;
        dados.push([r.data, r.func, r.turnoEsperado, r.entrada, r.saidaAlm, r.retAlm, r.saidaFim, atrClean, extClean, r.statusDia]);
      });
      let sheet = XLSX.utils.aoa_to_sheet(dados);
      let book = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(book, sheet, "Auditoria de Turnos");
      XLSX.writeFile(book, `Auditoria_Escalas_SR_${document.getElementById('filtroMes').value}.xlsx`);
    }

    function baixarPDF() {
      const { jsPDF } = window.jspdf;
      let doc = new jsPDF();
      doc.setFontSize(14); doc.text("SÃO RAIMUNDO SUPERMERCADO - AUDITORIA DE TURNOS CLT", 14, 15);
      let col = ["Data/Escala", "Funcionário", "Entrada", "S.Alm", "R.Alm", "Saída", "Débito", "Extra", "Status"];
      let rows = [];
      relatorioFinal.forEach(r => {
        let atrClean = r.atraso.includes("Incompleto") ? "Incompleto" : r.atraso;
        let extClean = r.extra.includes("Incompleto") ? "Incompleto" : r.extra;
        rows.push([`${r.data}\n(${r.turnoEsperado})`, r.func, r.entrada, r.saidaAlm, r.retAlm, r.saidaFim, atrClean, extClean, r.statusDia]);
      });
      doc.autoTable({ startY: 22, head: [col], body: rows, theme: 'grid', styles: { fontSize: 7, cellPadding: 2 } });
      doc.save(`Auditoria_Escalas_SR_${document.getElementById('filtroMes').value}.pdf`);
    }
  </script>
</body>
